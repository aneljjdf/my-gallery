<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 预存</title>
  <style>
    @font-face {
      font-family: "My Font";
      src: url("./fonts/myfont.ttf") format("truetype");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "My Font", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f8fc;
      color: #222;
      line-height: 1.7;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* 顶部导航 */
    .topbar {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 18px 0;
      border-bottom: 1px solid #d0dce8;
      font-size: 14px;
      letter-spacing: 0.15em;
    }

    .topbar a {
      color: #2a4a6a;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .topbar a:hover { opacity: 0.6; }

    /* 中央 Logo 区 */
    .logo-section {
      position: relative;
      text-align: center;
      padding: 80px 0;
      background-image:
        repeating-linear-gradient(
          to bottom,
          rgba(180, 200, 220, 0.06) 0px,
          rgba(180, 200, 220, 0.06) 1px,
          transparent 1px,
          transparent 20px
        );
      overflow: hidden;
    }

    /* 左侧弧形装饰 */
    .logo-section::before {
      content: "";
      position: absolute;
      top: -40px;
      left: -60px;
      width: 200px;
      height: 400px;
      border-right: 3px solid #555;
      border-radius: 0 200px 200px 0;
      opacity: 0.3;
      transform: rotate(-8deg);
    }

    .logo-placeholder {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #3a5a8a;
    }

    /* 右侧推广图 */
    .promo-banner {
      width: 100%;
      aspect-ratio: 4 / 1;
      background: linear-gradient(90deg, #5bb0c8 0%, #d94a4a 40%, #d94a4a 100%);
      border-radius: 4px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    /* News 区 */
    .news-section {
      margin-bottom: 30px;
    }

    .news-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #2a4a6a;
      padding-bottom: 12px;
      border-bottom: 1px solid #ccc;
      margin-bottom: 16px;
    }

    .news-heading .diamond {
      width: 18px;
      height: 18px;
      background: #2a4a6a;
      transform: rotate(45deg);
    }

    /* News 列表 */
    .news-list {
      border: 1px solid #d8e0e8;
      background: #fff;
    }

    .news-item {
      display: flex;
      padding: 12px 18px;
      border-bottom: 1px solid #eaeef2;
      font-size: 14px;
      align-items: baseline;
    }

    .news-item:last-child { border-bottom: none; }

    .news-date {
      width: 110px;
      flex-shrink: 0;
      background: #eef2f6;
      color: #555;
      font-size: 13px;
      padding: 2px 10px;
      margin-right: 16px;
      text-align: center;
    }

    .news-content {
      flex: 1;
      color: #2a4a6a;
      line-height: 1.8;
    }

    /* 底部两个按钮块 */
    .bottom-btns {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 16px;
      margin-bottom: 30px;
    }

    .bottom-btn {
      background: #eef2f6;
      border: 1px solid #d0dce8;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #2a4a6a;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .bottom-btn:hover { background: #e0e8f0; }

    .bottom-btn .right-list {
      font-size: 13px;
      font-weight: 400;
      color: #555;
      line-height: 1.8;
      text-align: right;
    }

    /* 右下角推广小图 */
    .corner-promo {
      width: 260px;
      aspect-ratio: 5 / 1;
      background: linear-gradient(90deg, #6ab0d0, #9ad0e8);
      border-radius: 3px;
      margin-left: auto;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
    }

    /* 底部版权行 */
    .footer {
      text-align: right;
      font-size: 13px;
      color: #888;
      padding-top: 20px;
      border-top: 1px solid #d0dce8;
      line-height: 2;
    }

    /* 手机适配 */
    @media (max-width: 768px) {
      .topbar {
        gap: 14px;
        font-size: 12px;
        letter-spacing: 0.05em;
        flex-wrap: wrap;
      }
      .logo-placeholder { font-size: 36px; }
      .logo-section { padding: 50px 0; }
      .news-item { flex-direction: column; gap: 6px; }
      .news-date { width: auto; margin-right: 0; }
      .bottom-btns { grid-template-columns: 1fr; }
      .corner-promo { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 顶部导航 -->
    <nav class="topbar">
      <a href=" ">TOP</a >
      <a href="#">STORY</a >
      <a href="#">CHARACTER</a >
      <a href="#">GALLERY</a >
    </nav>

    <!-- 中央 Logo -->
    <div class="logo-section">
      <div class="logo-placeholder">NORN9</div>
    </div>

    <!-- 右侧推广图 -->
    <div class="promo-banner">オトメイト×スペシャルグッズ</div>

    <!-- News -->
    <section class="news-section">
      <h2 class="news-heading">
        <span class="diamond"></span>
        News
      </h2>

      <div class="news-list">
        <div class="news-item">
          <div class="news-date">2018.07.17</div>
          <div class="news-content">システム / サウンド：主題歌情報 / インフォ：限定版特典情報 更新</div>
        </div>
        <div class="news-item">
          <div class="news-date">2018.07.02</div>
          <div class="news-content">ギャラリー / サウンド：BGM / インフォ：特典情報 更新</div>
        </div>
        <div class="news-item">
          <div class="news-date">2018.06.11</div>
          <div class="news-content">公式サイト 公開</div>
        </div>
      </div>
    </section>

    <!-- 底部两个按钮块 -->
    <div class="bottom-btns">
      <a href="#" class="bottom-btn">
        公式Twitter
      </a >
      <a href="#" class="bottom-btn">
        特典情報
        <div class="right-list">
          ◆限定版特典<br>
          ◆予約特典<br>
          ◆店舗特典
        </div>
      </a >
    </div>

    <!-- 右下推广小图 -->
    <div class="corner-promo">Nintendo Switch 版 好評発売中</div>

    <!-- 底部版权 -->
    <div class="footer">
      ©2018 IDEA FACTORY<br>
      Nintendo Switchのロゴは…
    </div>

  </div>

</body>
</html>
