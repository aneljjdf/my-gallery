<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "My Font", "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #fafafa;
  color: #111;
}

/* ===== 唯一滚动容器：最上层，透明 ===== */
.scroller {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  z-index: 10;
}

/* 滚动高度：4 屏 */
.scroller-inner {
  height: 400vh;
  pointer-events: none;
}

/* ===== 第一段：白底（固定） ===== */
.intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  z-index: 1;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}

.intro-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

.intro-img {
  width: 320px;
  height: 320px;
  object-fit: cover;
  transition: filter 0.1s linear;
}

.intro-word {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  color: #111;
}

/* ===== 第二段：黑底（固定） ===== */
.black-cover {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 2;
  transform: translateY(100%);
  will-change: transform;
  overflow: hidden;
  -webkit-transform: translateZ(0);
}

.black-word {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  color: #f0f0f0;
  opacity: 0;
  transition: opacity 0.4s ease;
  white-space: nowrap;
}

.black-word.show { opacity: 1; }

.black-text {
  position: absolute;
  left: 50%;
  bottom: 20%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 640px;
  text-align: center;
  font-size: 14px;
  line-height: 2.2;
  letter-spacing: 0.06em;
  color: #888;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.black-text.show { opacity: 1; }

/* ===== 第四段：白底回落 ===== */
.outro {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
}

.outro a {
  font-size: 13px;
  letter-spacing: 0.3em;
  color: #666;
  text-decoration: none;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  transition: color 0.3s, border-color 0.3s;
}

.outro a:hover {
  color: #111;
  border-color: #111;
}

/* ===== 手机 ===== */
@media (max-width: 768px) {
  .intro-inner {
    flex-direction: column;
    gap: 24px;
  }
  .intro-img { width: 200px; height: 200px; }
  .intro-word,
  .black-word { font-size: 26px; }
  .black-text { font-size: 13px; }
}
</style>
</head>
<body>

<!-- 第一段：白底（固定） -->
<section class="intro">
  <div class="intro-inner">
    <img class="intro-img" id="introImg" src="IMG_1959.PNG" alt="">
    <div class="intro-word" id="introWord">ARCHIVE</div>
  </div>
</section>

<!-- 第二段：黑底（固定） -->
<section class="black-cover" id="blackCover">
  <div class="black-word" id="blackWord">ARCHIVE</div>
  <div class="black-text" id="blackText">
    这里收录的，是我看过的秀场造型里，留下来的那些。<br>
    不是最好看的，是看过后还愿意留下的。<br><br>
    看过的远不止这些，这里只放留下来的。
  </div>
</section>

<!-- 唯一滚动容器（最上层，透明） -->
<div class="scroller" id="scroller">
  <div class="scroller-inner"></div>

  <!-- 第四段：白底（在 scroller 里，才能滚到） -->
  <section class="outro">
    <a href="index.html">回到档案</a>
  </section>
</div>

<script>
const scroller = document.getElementById('scroller');
const introImg = document.getElementById('introImg');
const blackCover = document.getElementById('blackCover');
const blackWord = document.getElementById('blackWord');
const blackText = document.getElementById('blackText');

function update() {
  const scrollY = scroller.scrollTop;
  const vh = window.innerHeight;

  // ===== 第 1 段：黑底升起（0 → 1vh） =====
  const p1 = Math.min(scrollY / vh, 1);

  // 黑底上升（用 translateY）
  if (p1 < 1 || scrollY < vh) {
    blackCover.style.transform = `translateY(${(1 - p1) * 100}%)`;
    blackCover.style.transformOrigin = 'center center';
    blackCover.style.borderRadius = '0';
    blackCover.style.opacity = '1';
  }

  // 图：模糊 + 变暗，位置不动
  introImg.style.filter = `blur(${p1 * 14}px) brightness(${1 - p1 * 0.5})`;

  // ===== 第 2 段：黑底贴顶后（1vh → 2vh） =====
  const p2 = Math.max(0, Math.min((scrollY - vh) / vh, 1));

  if (p1 > 0.5 && p2 < 0.9) {
    blackWord.classList.add('show');
  } else {
    blackWord.classList.remove('show');
  }

  if (p2 > 0.15 && p2 < 0.9) {
    blackText.classList.add('show');
  } else {
    blackText.classList.remove('show');
  }

  // ===== 第 3 段：黑底缩成正圆（2vh → 3vh） =====
  const p3 = Math.max(0, Math.min((scrollY - vh * 2) / vh, 1));

  if (p3 > 0) {
    // 用 scale 统一缩，宽高一致，永远是正圆
    const scale = 1 - p3 * 0.96;
    blackCover.style.transform = `scale(${scale})`;
    blackCover.style.transformOrigin = 'center center';
    blackCover.style.borderRadius = '50%';
    blackCover.style.opacity = String(1 - p3 * 0.6);
  }
}

scroller.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
update();
</script>

</body>
</html>
