<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: "My Font", "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #fafafa;
  color: #111;
  overflow-x: hidden;
}

/* ===== 第一段：白底 ===== */
.intro {
  position: relative;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  z-index: 1;
}

.intro-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

.intro-img {
  width: 320px;
  height: 320px;
  object-fit: cover;
}

.intro-word {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  color: #111;
}

/* ===== 第二段：黑底覆盖 ===== */
.black-cover {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 2;
  transform: translateY(100%);
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 黑底内部：能缩成圆 */
.black-inner {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 32px;
  text-align: center;
  transition: none;
}

.black-word {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  color: #f0f0f0;
  margin-bottom: 60px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.black-word.show {
  opacity: 1;
  transform: translateY(0);
}

.black-text {
  font-size: 14px;
  line-height: 2.2;
  letter-spacing: 0.06em;
  color: #888;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
}

.black-text.show {
  opacity: 1;
  transform: translateY(0);
}

/* ===== 第三段：白底回落 ===== */
.outro {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
}

.outro a {
  font-size: 13px;
  letter-spacing: 0.3em;
  color: #666;
  text-decoration: none;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  transition: color 0.3s, border-color 0.3s;
}

.outro a:hover {
  color: #111;
  border-color: #111;
}

/* ===== 手机 ===== */
@media (max-width: 768px) {
  .intro-inner {
    flex-direction: column;
    gap: 24px;
  }
  .intro-img { width: 200px; height: 200px; }
  .intro-word,
  .black-word { font-size: 26px; }
  .black-text { font-size: 13px; }
}
</style>
</head>
<body>

<!-- 第一段 -->
<section class="intro">
  <div class="intro-inner">
    <img class="intro-img" id="introImg" src="IMG_1959.PNG" alt="">
    <div class="intro-word" id="introWord">ARCHIVE</div>
  </div>
</section>

<!-- 第二段：黑底 -->
<section class="black-cover" id="blackCover">
  <div class="black-inner" id="blackInner">
    <div class="black-word" id="blackWord">ARCHIVE</div>
    <div class="black-text" id="blackText">
      这里收录的，是我看过的秀场造型里，留下来的那些。<br>
      不是最好看的，是看过后还愿意留下的。<br><br>
      看过的远不止这些，这里只放留下来的。
    </div>
  </div>
</section>

<!-- 第三段 -->
<section class="outro">
  <a href="index.html">回到档案</a>
</section>

<script>
const introImg = document.getElementById('introImg');
const introWord = document.getElementById('introWord');
const blackCover = document.getElementById('blackCover');
const blackInner = document.getElementById('blackInner');
const blackWord = document.getElementById('blackWord');
const blackText = document.getElementById('blackText');

function update() {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;

  // ===== 第 1 段：黑底升起 =====
  // 0 → 1vh：黑底从底部升到盖住
  const p1 = Math.min(scrollY / vh, 1);

  // ===== 第 2 段：黑底缩圆 =====
  // 1vh → 2vh：黑底缩成圆形，被白底吞
  const p2 = Math.max(0, Math.min((scrollY - vh) / vh, 1));

  // 黑底：先升起，再缩圆
  if (p2 === 0) {
    // 上升阶段
    blackCover.style.transform = `translateY(${(1 - p1) * 100}%)`;
    blackCover.style.borderRadius = '0';
    blackCover.style.opacity = '1';
    blackCover.style.width = '100%';
    blackCover.style.height = '100%';
    blackCover.style.left = '0';
    blackCover.style.top = '0';
    blackCover.style.right = 'auto';
    blackCover.style.bottom = 'auto';
  } else {
    // 缩圆阶段：从全屏缩成中间一个小圆
    blackCover.style.transform = 'translateY(0)';
    const size = 100 - p2 * 96; // 100% → 4%
    blackCover.style.width = size + '%';
    blackCover.style.height = size + '%';
    blackCover.style.left = '50%';
    blackCover.style.top = '50%';
    blackCover.style.transform = `translate(-50%, -50%)`;
    blackCover.style.borderRadius = '50%';
    blackCover.style.opacity = String(1 - p2 * 0.3);
  }

  // 图：模糊 + 上移 + 淡出（第 1 段）
  introImg.style.filter = `blur(${p1 * 12}px)`;
  introImg.style.transform = `translateY(${-p1 * 60}px)`;
  introImg.style.opacity = 1 - p1 * 0.9;

  // 白底上的词：淡出
  introWord.style.opacity = 1 - p1 * 1.5;

  // 黑底上的词：过半浮现，缩圆时淡出
  if (p1 > 0.5 && p2 < 0.4) {
    blackWord.classList.add('show');
  } else {
    blackWord.classList.remove('show');
  }

  // 黑底文字：浮现，缩圆时淡出
  if (p1 > 0.65 && p2 < 0.4) {
    blackText.classList.add('show');
  } else {
    blackText.classList.remove('show');
  }

  // 黑底内部内容：缩圆时一起淡出
  blackInner.style.opacity = String(1 - p2 * 2);
}

window.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
update();
</script>

</body>
</html>
