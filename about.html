<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: "My Font", "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #fafafa;
  color: #111;
  overflow-x: hidden;
}

/* ===== 第一段：白底（固定不动） ===== */
.intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  z-index: 1;
}

.intro-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

.intro-img {
  width: 320px;
  height: 320px;
  object-fit: cover;
  transition: filter 0.1s linear;
}

.intro-word {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  color: #111;
}

/* ===== 第二段：黑底 ===== */
.black-cover {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 2;
  transform: translateY(100%);
  will-change: transform;
  overflow: hidden;
}

/* 黑底上的词：一开始贴在黑底顶部，跟着黑底上移 */
.black-word {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  color: #f0f0f0;
  opacity: 0;
  transition: opacity 0.4s ease;
  white-space: nowrap;
}

.black-word.show {
  opacity: 1;
}

/* 黑底下的文字：黑底贴顶后才浮出 */
.black-text {
  position: absolute;
  left: 50%;
  bottom: 20%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 640px;
  text-align: center;
  font-size: 14px;
  line-height: 2.2;
  letter-spacing: 0.06em;
  color: #888;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.black-text.show {
  opacity: 1;
}

/* ===== 第三段：滚动占位 ===== */
.scroll-space {
  height: 300vh;
  pointer-events: none;
}

/* ===== 第四段：白底回落 ===== */
.outro {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
}

.outro a {
  font-size: 13px;
  letter-spacing: 0.3em;
  color: #666;
  text-decoration: none;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  transition: color 0.3s, border-color 0.3s;
}

.outro a:hover {
  color: #111;
  border-color: #111;
}

/* ===== 手机 ===== */
@media (max-width: 768px) {
  .intro-inner {
    flex-direction: column;
    gap: 24px;
  }
  .intro-img { width: 200px; height: 200px; }
  .intro-word,
  .black-word { font-size: 26px; }
  .black-text { font-size: 13px; }
}
</style>
</head>
<body>

<!-- 第一段：白底（固定） -->
<section class="intro">
  <div class="intro-inner">
    <img class="intro-img" id="introImg" src="IMG_1959.webp" alt="">
    <div class="intro-word" id="introWord">ARCHIVE</div>
  </div>
</section>

<!-- 第二段：黑底 -->
<section class="black-cover" id="blackCover">
  <div class="black-word" id="blackWord">ARCHIVE</div>
  <div class="black-text" id="blackText">
    这里收录的，是我看过的秀场造型里，留下来的那些。<br>
    不是最好看的，是看过后还愿意留下的。<br><br>
    看过的远不止这些，这里只放留下来的。
  </div>
</section>

<!-- 滚动占位 -->
<div class="scroll-space"></div>

<!-- 第四段：白底 -->
<section class="outro">
  <a href="index.html">回到档案</a>
</section>

<script>
const introImg = document.getElementById('introImg');
const blackCover = document.getElementById('blackCover');
const blackWord = document.getElementById('blackWord');
const blackText = document.getElementById('blackText');

function update() {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;

  // ===== 第 1 段：黑底升起（0 → 1vh） =====
  const p1 = Math.min(scrollY / vh, 1);

  // 黑底从底部升到顶部
  blackCover.style.transform = `translateY(${(1 - p1) * 100}%)`;

  // 白底图片：随黑底覆盖，模糊 + 变暗
  introImg.style.filter = `blur(${p1 * 14}px) brightness(${1 - p1 * 0.5})`;

  // ===== 第 2 段：黑底贴顶后（1vh → 3vh） =====
  const p2 = Math.max(0, Math.min((scrollY - vh) / (vh * 2), 1));

  // 黑底上的词：黑底升到一半时出现，贴在黑底中央
  if (p1 > 0.5 && p2 < 0.9) {
    blackWord.classList.add('show');
  } else {
    blackWord.classList.remove('show');
  }

  // 黑底上的文字：黑底贴顶后浮现
  if (p2 > 0.15 && p2 < 0.9) {
    blackText.classList.add('show');
  } else {
    blackText.classList.remove('show');
  }

  // ===== 第 3 段：黑底缩成圆（2vh → 3vh） =====
  const p3 = Math.max(0, Math.min((scrollY - vh * 2) / vh, 1));

  if (p3 > 0) {
    const size = 100 - p3 * 96;
    blackCover.style.width = size + '%';
    blackCover.style.height = size + '%';
    blackCover.style.left = '50%';
    blackCover.style.top = '50%';
    blackCover.style.right = 'auto';
    blackCover.style.bottom = 'auto';
    blackCover.style.transform = `translate(-50%, -50%)`;
    blackCover.style.borderRadius = '50%';
    blackCover.style.opacity = String(1 - p3 * 0.6);
  } else {
    blackCover.style.width = '100%';
    blackCover.style.height = '100%';
    blackCover.style.left = '0';
    blackCover.style.top = '0';
    blackCover.style.right = 'auto';
    blackCover.style.bottom = 'auto';
    blackCover.style.borderRadius = '0';
    blackCover.style.opacity = '1';
  }
}

window.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
update();
</script>

</body>
</html>
