<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive 档案</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: "Inter", "Noto Sans SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #f8f9fa;
  color: #1a1a1a;
  line-height: 1.7;
  padding: 0 40px 140px;
  -webkit-font-smoothing: antialiased;
  font-weight: 400;
}

img {
  -webkit-user-drag: none;
  pointer-events: auto;
}

input {
  -webkit-user-select: text;
  user-select: text;
}

/* ===== 开屏 ===== */
.splash {
  position: fixed;
  inset: 0;
  background: #f8f9fa;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: bgOut 0.6s ease 2.6s forwards;
}

.splash span {
  font-family: "Inter", sans-serif;
  font-style: normal;
  font-weight: 300;
  font-size: 32px;
  letter-spacing: 0.4em;
  color: #c8c8c8;
  opacity: 0;
  filter: blur(8px);
  animation: blurIn 1s ease forwards, textOut 0.6s ease 2s forwards;
  text-transform: lowercase;
}

@keyframes blurIn { to { opacity: 1; filter: blur(0); } }
@keyframes textOut { to { opacity: 0; filter: blur(6px); } }
@keyframes bgOut { to { opacity: 0; visibility: hidden; } }

.splash.done {
  display: none;
}

/* ===== 顶栏 ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248, 249, 250, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 0 -40px 80px;
  padding: 22px 40px;
}

.topbar .logo {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.4em;
  color: #1a1a1a;
  flex-shrink: 0;
  text-transform: uppercase;
}

.topbar .search-btn {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: #888;
  cursor: pointer;
  transition: color 0.3s;
  user-select: none;
  text-transform: uppercase;
}

.topbar .search-btn:hover { color: #1a1a1a; }

/* ===== 容器 ===== */
.container { max-width: 1400px; margin: 0 auto; }

.page-header { text-align: center; margin-bottom: 100px; }

.page-header h1 {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.6em;
  color: #1a1a1a;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.page-header .sub {
  font-size: 11px;
  letter-spacing: 0.35em;
  color: #aaa;
  font-weight: 300;
}

/* ===== 品牌网格：3 列 ===== */
.brand-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 72px 32px;
}

.brand-card { cursor: pointer; }

.brand-cover {
  position: relative;
  aspect-ratio: 4 / 5;
  background: #ececec;
  overflow: hidden;
  margin-bottom: 20px;
}

.brand-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.6s ease, opacity 0.4s ease;
  pointer-events: none;
  opacity: 0.96;
}

.brand-card:hover .brand-cover img {
  transform: scale(1.02);
  opacity: 0.85;
}

.brand-name {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.22em;
  color: #1a1a1a;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.brand-count {
  font-size: 10px;
  color: #aaa;
  letter-spacing: 0.22em;
  font-weight: 300;
  text-transform: uppercase;
}

/* ===== 全屏搜索页 ===== */
.search-page {
  position: fixed;
  inset: 0;
  background: rgba(248, 249, 250, 0.98);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 500;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 80px 40px 140px;
}

.search-page.active { display: block; }

.search-page-inner {
  max-width: 800px;
  margin: 0 auto;
}

.search-page-input-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.12);
  padding-bottom: 14px;
  margin-bottom: 40px;
}

.search-page-input-wrap svg {
  width: 16px;
  height: 16px;
  stroke: #999;
  flex-shrink: 0;
}

.search-page-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 0.15em;
  color: #1a1a1a;
  font-weight: 400;
}

.search-page-input::placeholder { color: #ccc; letter-spacing: 0.2em; font-size: 12px; text-transform: uppercase; }

.search-page-clear {
  display: none;
  width: 14px;
  height: 14px;
  stroke: #999;
  cursor: pointer;
  flex-shrink: 0;
  transition: stroke 0.2s;
}

.search-page-clear:hover { stroke: #1a1a1a; }
.search-page-clear.show { display: block; }

.alpha-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-bottom: 50px;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: #ccc;
  font-weight: 300;
}

.alpha-bar span {
  cursor: pointer;
  transition: color 0.2s;
  user-select: none;
}

.alpha-bar span:hover { color: #1a1a1a; }

.alpha-bar span.has-brand { color: #1a1a1a; }

.search-brand-list {
  display: flex;
  flex-direction: column;
}

.search-brand-item {
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #666;
  padding: 20px 0;
  border-bottom: 1px solid rgba(0, 0, 0, 0.04);
  cursor: pointer;
  transition: color 0.25s, padding-left 0.25s;
  user-select: none;
  text-transform: uppercase;
  font-weight: 400;
}

.search-brand-item:hover {
  color: #1a1a1a;
  padding-left: 10px;
}

.alpha-group-title {
  font-size: 9px;
  letter-spacing: 0.3em;
  color: #bbb;
  margin-top: 40px;
  margin-bottom: 8px;
  text-transform: uppercase;
  font-weight: 400;
}

.alpha-group-title:first-child { margin-top: 0; }

/* ===== 展开层 ===== */
.expand-layer {
  position: fixed;
  inset: 0;
  background: rgba(248, 249, 250, 0.98);
  z-index: 100;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 80px 40px 140px;
}

.expand-layer.active { display: block; }

.expand-inner { max-width: 1400px; margin: 0 auto; }

.expand-header {
  margin-bottom: 60px;
  text-align: center;
}

.expand-title {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.35em;
  color: #1a1a1a;
  text-transform: uppercase;
}

.expand-images {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 32px;
  justify-content: start;
}

.expand-images .thumb {
  position: relative;
  aspect-ratio: 4 / 5;
  background: #ececec;
  overflow: hidden;
  cursor: pointer;
  transition: opacity 0.4s;
}

.expand-images .thumb:hover { opacity: 0.85; }

.expand-images .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.expand-images .thumb-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 14px;
  background: linear-gradient(transparent, rgba(0,0,0,0.5));
  color: #fff;
  font-size: 9px;
  letter-spacing: 0.2em;
  pointer-events: none;
  text-transform: uppercase;
  font-weight: 400;
}

/* ===== 大图预览 ===== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.97);
  display: none;
  z-index: 999;
  cursor: pointer;
}

.lightbox.active { display: block; }

.lightbox-img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 80vw;
  max-height: 69vh;
  object-fit: contain;
  cursor: default;
  display: block;
}

.lightbox-caption {
  position: absolute;
  bottom: 6vh;
  left: 0;
  right: 0;
  text-align: center;
  cursor: default;
  padding: 0 40px;
}

.lightbox-caption .label {
  font-family: "Inter", sans-serif;
  font-style: normal;
  font-weight: 400;
  font-size: 10px;
  letter-spacing: 0.4em;
  color: #777;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.lightbox-caption .note {
  font-family: "Noto Sans SC", -apple-system, "Microsoft YaHei", sans-serif;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #b8b8b8;
  font-weight: 300;
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  user-select: none;
  opacity: 0.4;
  transition: opacity 0.2s;
  font-weight: 200;
}

.lightbox-arrow:hover { opacity: 1; }
.lightbox-arrow.prev { left: 36px; }
.lightbox-arrow.next { right: 36px; }

.lightbox-counter {
  position: absolute;
  top: 40px;
  left: 48px;
  color: #777;
  font-size: 10px;
  letter-spacing: 0.3em;
  cursor: default;
  text-transform: uppercase;
  font-weight: 400;
}

/* ===== 页脚 ===== */
.footer {
  margin-top: 160px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #bbb;
  line-height: 2.6;
  text-transform: uppercase;
  font-weight: 300;
}

.footer .links { margin-top: 14px; }

.footer .links a {
  color: #bbb;
  text-decoration: none;
  margin: 0 12px;
  transition: color 0.3s ease;
  letter-spacing: 0.3em;
}

.footer .links a:hover { color: #1a1a1a; }

/* ===== 回到顶部 ===== */
.to-top {
  position: fixed;
  right: 36px;
  bottom: 36px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #999;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 200;
  user-select: none;
  font-weight: 300;
}

.to-top.show { opacity: 0.6; pointer-events: auto; }
.to-top:hover { opacity: 1; }

/* ===== 手机 ===== */
@media (max-width: 768px) {
  body { padding: 0 20px 100px; }

  .topbar {
    margin: 0 -20px 50px;
    padding: 16px 20px;
    gap: 12px;
  }

  .topbar .logo { font-size: 11px; }
  .topbar .search-btn { font-size: 10px; }

  .page-header { margin-bottom: 60px; }
  .page-header h1 { font-size: 12px; letter-spacing: 0.5em; }
  .page-header .sub { font-size: 10px; }

  .brand-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 40px 16px;
  }

  .brand-name { font-size: 11px; letter-spacing: 0.18em; }
  .brand-count { font-size: 9px; }

  .search-page { padding: 50px 20px 100px; }
  .search-page-input { font-size: 13px; }
  .alpha-bar { gap: 6px 10px; font-size: 9px; }
  .search-brand-item { font-size: 11px; padding: 16px 0; }

  .expand-layer { padding: 50px 20px 100px; }
  .expand-title { font-size: 12px; letter-spacing: 0.3em; }

  .expand-images {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    justify-content: stretch;
  }

  .lightbox-img { max-width: 92vw; max-height: 68vh; }
  .lightbox-arrow { font-size: 20px; }
  .lightbox-arrow.prev { left: 12px; }
  .lightbox-arrow.next { right: 12px; }

  .lightbox-caption { bottom: 5vh; padding: 0 24px; }
  .lightbox-caption .label { font-size: 9px; margin-bottom: 8px; }
  .lightbox-caption .note { font-size: 11px; }

  .footer { margin-top: 100px; font-size: 9px; }
  .to-top { right: 20px; bottom: 20px; width: 32px; height: 32px; font-size: 13px; }
}
</style>
</head>

/* ===== 开屏：只在本次会话第一次进站时播放 ===== */
(function () {
  const splash = document.getElementById('splash');
  if (sessionStorage.getItem('splashShown') === '1') {
    splash.classList.add('done');
  } else {
    sessionStorage.setItem('splashShown', '1');

/* ===== 变音符号降级 ===== */
const LIGATURE_MAP = {
  'Æ': 'AE', 'Œ': 'OE', 'Ø': 'O', 'ß': 'SS',
  'Đ': 'D', 'Ł': 'L', 'Þ': 'TH', 'Ð': 'D', 'Ħ': 'H'
};

function toBase(str) {
  let s = (str || '').toString();
  s = s.replace(/[ÆŒØßĐŁÞÐĦæœøßđłþðħ]/g, ch => LIGATURE_MAP[ch.toUpperCase()] || ch);
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.toUpperCase();
}

function getBrandLetter(b) {
  const parts = b.name.trim().split(/\s+/);
  const last = parts[parts.length - 1] || b.name;
  const base = toBase(last);
  return base[0] || '';
}

function getSearchKey(name) {
  return toBase(name);
}

/* ===== 品牌网格：生成卡片 + 展开层 ===== */
const brandGrid = document.getElementById('brandGrid');
const toTop = document.getElementById('toTop');

brandsData.forEach(brand => {

  card.className = 'brand-card';

    </div>
    <div class="brand-name">${brand.name}</div>
    <div class="brand-count">${brand.images.length} ${brand.images.length > 1 ? 'looks' : 'look'}</div>
  `;
  brandGrid.appendChild(card);

  const layer = document.createElement('div');
  layer.className = 'expand-layer';
  layer.id = brand.expand;

  const thumbsHTML = brand.images.map((img) => {
    return `
      <div class="thumb" data-brand="${brand.name}" data-season="${img.season}" data-note="${img.note}">
        <img src="images/${brand.folder}/${img.file}" alt="" loading="lazy" draggable="false">
        <div class="thumb-label">${img.season}</div>
      </div>
    `;
  }).join('');

  layer.innerHTML = `
    <div class="expand-inner">
      <div class="expand-header">
        <div class="expand-title">${brand.name}</div>
      </div>
      <div class="expand-images">
        ${thumbsHTML}
      </div>
    </div>
  `;
  document.body.appendChild(layer);
});

/* ===== 全屏搜索页元素 ===== */
const searchPage = document.getElementById('searchPage');
const searchBtn = document.getElementById('searchBtn');
const searchPageInput = document.getElementById('searchPageInput');
const searchPageClear = document.getElementById('searchPageClear');
const alphaBar = document.getElementById('alphaBar');
const searchBrandList = document.getElementById('searchBrandList');

/* ===== 分层回退标记 ===== */
let expandFromSearch = false;

/* ===== 展开层 ===== */
function openExpand(id) {
  const layer = document.getElementById(id);
  layer.classList.add('active');
  document.body.style.overflow = 'hidden';
  toTop.classList.remove('show');

  if (searchPage.classList.contains('active')) {
    expandFromSearch = true;
    searchPage.classList.remove('active');
  } else {
    expandFromSearch = false;
  }
}

function closeExpand(id) {
  document.getElementById(id).classList.remove('active');

  if (expandFromSearch) {
    searchPage.classList.add('active');
    expandFromSearch = false;
  } else {
    document.body.style.overflow = '';
  }
}

document.querySelectorAll('.expand-layer').forEach(layer => {
  layer.addEventListener('click', (e) => {
    if (e.target.closest('.thumb')) return;
    closeExpand(layer.id);
  });
});

/* ===== 大图预览 ===== */
let currentImages = [];
let currentIndex = 0;

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const captionBox = document.getElementById('captionBox');
const counter = document.getElementById('counter');

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  if (document.querySelector('.expand-layer.active') || searchPage.classList.contains('active')) {
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
  }
}

function updateLightbox() {
  const img = currentImages[currentIndex];
  lightboxImg.src = img.src;

  if (img.note) {
    captionBox.innerHTML = `
      <div class="label">Directive</div>
      <div class="note">${img.note}</div>
    `;
  } else {
    captionBox.innerHTML = '';
  }

  counter.textContent = (currentIndex + 1) + ' / ' + currentImages.length;
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateLightbox();
}

function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateLightbox();
}

document.querySelectorAll('.expand-layer').forEach(layer => {
  const thumbs = Array.from(layer.querySelectorAll('.thumb'));
  const imgList = thumbs.map(t => ({
    src: t.querySelector('img').src,
    brand: t.dataset.brand || '',
    season: t.dataset.season || '',
    note: t.dataset.note || ''
  }));

  thumbs.forEach((thumb, i) => {
    thumb.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(imgList, i);
    });
  });
});

lightbox.addEventListener('click', (e) => {
  if (e.target.classList.contains('lightbox-img')) return;
  if (e.target.closest('.lightbox-arrow')) return;
  closeLightbox();
});

document.getElementById('prev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevImage();
});
document.getElementById('next').addEventListener('click', (e) => {
  e.stopPropagation();
  nextImage();
});

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'Escape') closeLightbox();
  } else if (document.querySelector('.expand-layer.active')) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.expand-layer.active').forEach(l => l.classList.remove('active'));
      document.body.style.overflow = '';
    }
  } else if (searchPage.classList.contains('active')) {
    if (e.key === 'Escape') closeSearchPage();
  }
});

/* ===== 底部数字 ===== */
const totalBrands = brandsData.length;
const totalImages = brandsData.reduce((sum, b) => sum + b.images.length, 0);
document.getElementById('footer').textContent =
  totalBrands + ' brands · ' + totalImages + ' images';

/* ===== 回到顶部 ===== */
window.addEventListener('scroll', () => {
  const inOverlay = document.querySelector('.expand-layer.active') || searchPage.classList.contains('active');
  if (!inOverlay && window.scrollY > 400) {
    toTop.classList.add('show');
  } else {
    toTop.classList.remove('show');
  }
});

toTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ===== 搜索页打开 / 关闭 ===== */
searchBtn.addEventListener('click', () => {
  searchPage.classList.add('active');
  document.body.style.overflow = 'hidden';
  searchPage.scrollTop = 0;
});

function closeSearchPage() {
  searchPage.classList.remove('active');
  document.body.style.overflow = '';
  searchPageInput.value = '';
  searchPageClear.classList.remove('show');
  renderBrandList('');
}

/* ===== 生成 A–Z ===== */
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

const existingLetters = new Set(
  brandsData.map(b => getBrandLetter(b))
);

ALPHA.forEach(letter => {
  const span = document.createElement('span');
  span.textContent = letter;
  span.dataset.letter = letter;
  if (existingLetters.has(letter)) span.classList.add('has-brand');
  span.addEventListener('click', () => {
    const target = searchBrandList.querySelector('.alpha-group-title[data-letter="' + letter + '"]');
    if (target) {
      const top = target.offsetTop - 20;
      searchPage.scrollTo({ top: top, behavior: 'smooth' });
    }
  });
  alphaBar.appendChild(span);
});

/* ===== 渲染品牌列表 ===== */
function renderBrandList(keyword) {
  const kw = getSearchKey(keyword || '').trim();
  searchBrandList.innerHTML = '';

  const filtered = brandsData.filter(b => {
    if (!kw) return true;
    return getSearchKey(b.name).startsWith(kw);
  });

  const grouped = {};
  filtered.forEach(b => {
    const letter = getBrandLetter(b);
    if (!grouped[letter]) grouped[letter] = [];
    grouped[letter].push(b);
  });

  const letters = Object.keys(grouped).sort();

  if (letters.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-brand-item';
    empty.style.cursor = 'default';
    empty.style.color = '#ccc';
    empty.textContent = 'no results';
    searchBrandList.appendChild(empty);
    return;
  }

  letters.forEach(letter => {
    const title = document.createElement('div');
    title.className = 'alpha-group-title';
    title.dataset.letter = letter;
    title.textContent = letter;
    searchBrandList.appendChild(title);

    grouped[letter].sort((a, b) =>
      getSearchKey(a.name).localeCompare(getSearchKey(b.name), 'en')
    );

    grouped[letter].forEach(b => {
      const item = document.createElement('div');
      item.className = 'search-brand-item';
      item.textContent = b.name;
      item.addEventListener('click', () => {
        openExpand(b.expand);
      });
      searchBrandList.appendChild(item);
    });
  });
}

renderBrandList('');

/* ===== 搜索页输入 ===== */
searchPageInput.addEventListener('input', () => {
  const v = searchPageInput.value;
  renderBrandList(v);
  searchPageClear.classList.toggle('show', v.length > 0);
  searchPage.scrollTop = 0;
});

searchPageClear.addEventListener('click', () => {
  searchPageInput.value = '';
  searchPageClear.classList.remove('show');
  renderBrandList('');
  searchPage.scrollTop = 0;
});

searchPageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchPageInput.value = '';
    searchPageClear.classList.remove('show');
    renderBrandList('');
    searchPageInput.blur();
  }
});

/* ===== 搜索页点空白 → 回主页 ===== */
searchPage.addEventListener('click', (e) => {
  if (e.target.closest('.search-brand-item')) return;
  if (e.target.closest('.search-page-input-wrap')) return;
  if (e.target.closest('.alpha-bar')) return;
  if (e.target.closest('.alpha-group-title')) return;
  closeSearchPage();
});

/* ===== 品牌卡 A→Z 排序（按降级名） ===== */
const cards = Array.from(brandGrid.querySelectorAll('.brand-card'));

cards.sort((a, b) => {
  const nameA = getSearchKey(a.dataset.name || '');
  const nameB = getSearchKey(b.dataset.name || '');
  return nameA.localeCompare(nameB, 'en');
});

cards.forEach(card => brandGrid.appendChild(card));
</script>

</body>
</html>
