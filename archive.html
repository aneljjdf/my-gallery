<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0.07</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Cline x1='20' y1='50' x2='80' y2='50' stroke='%23000000' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     令牌层
     ============================================================ */
  :root {
    --fs-1: 10px;
    --fs-2: 12px;
    --fs-3: 14px;
    --fs-4: 20px;
    --fs-5: 80px;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 16px;
    --sp-4: 24px;
    --sp-5: 40px;
    --sp-6: 80px;

    --c-black: #000;
    --c-grey:  #999;
    --c-line:  #e5e5e5;

    --ease: cubic-bezier(.2, 0, 0, 1);
    --dur: 300ms;

    --cols: 12;
    --gutter: var(--sp-4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #fff;
    color: var(--c-black);
    font-family: "Inter", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     顶栏：三段式 sticky + 滚动隐藏
     ============================================================ */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--sp-3) var(--sp-3);
    transform: translateY(0);
    transition: transform var(--dur) var(--ease);
    will-change: transform;
  }
  .site-header.is-hidden {
    transform: translateY(-100%);
  }
  @media (min-width: 1024px) {
    .site-header { padding: var(--sp-3) var(--sp-6); }
  }

  .logo-swap {
    display: inline-block;
    overflow: hidden;
    height: 20px;
    cursor: pointer;
    text-decoration: none;
    color: var(--c-black);
    outline: none;
  }
  .logo-swap__inner {
    display: flex;
    flex-direction: column;
    transition: transform var(--dur) var(--ease);
  }
  .logo-swap:hover .logo-swap__inner {
    transform: translateY(-100%);
  }
  .logo-swap__line {
    height: 20px;
    line-height: 20px;
    font-size: var(--fs-3);
    font-weight: 500;
    letter-spacing: 1%;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .logo-swap__line--alt {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
  }

  .issue-current {
    font-size: var(--fs-3);
    font-weight: 500;
    letter-spacing: 1%;
    text-transform: uppercase;
  }

  .archive-link {
    font-size: var(--fs-2);
    letter-spacing: .1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--c-grey);
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    transition: color var(--dur) var(--ease);
    outline: none;
  }
  .archive-link:hover { color: var(--c-black); }
  .archive-link .arrow {
    display: inline-block;
    transition: transform var(--dur) var(--ease);
  }
  .archive-link:hover .arrow { transform: translateX(2px); }

  /* ============================================================
     图墙
     ============================================================ */
  .gallery-container {
    padding: var(--sp-6) 10vw calc(var(--sp-6) * 2.5);
    max-width: 1200px;
    margin: 0 auto;
  }

  .specimen-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25vh;
  }

  .specimen {
    width: 100%;
    max-width: 500px;
    text-align: center;
    cursor: crosshair;
  }

  .specimen img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity var(--dur) var(--ease);
  }
  .specimen:hover img { opacity: .9; }

  .specimen-info { margin-top: var(--sp-4); }

  .specimen-name {
    font-size: var(--fs-2);
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--c-black);
  }
  .specimen-season {
    font-size: var(--fs-1);
    letter-spacing: .1em;
    color: var(--c-grey);
    margin-top: var(--sp-1);
    text-transform: uppercase;
  }

  /* ============================================================
     底部：PREV / NEXT 窄容器对称
     ============================================================ */
  .issue-nav {
    margin-top: 25vh;
    margin-bottom: 5vh;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--sp-3);
  }

  .issue-nav a {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    text-decoration: none;
    color: var(--c-black);
    font-size: var(--fs-2);
    letter-spacing: .3em;
    text-transform: uppercase;
    transition: color var(--dur) var(--ease);
    
    /* 干掉点击外框和移动端点击高亮 */
    outline: none; 
    -webkit-tap-highlight-color: transparent;
  }
  
  .issue-nav a:focus {
    outline: none;
  }
  .issue-nav a:focus-visible {
    outline: none;
    color: var(--c-grey);
  }

  .issue-nav a .arrow {
    display: inline-block;
    transition: transform var(--dur) var(--ease);
  }

  .issue-nav a:hover { color: var(--c-grey); }
  .issue-nav a.nav-prev:hover .arrow { transform: translateX(-2px); }
  .issue-nav a.nav-next:hover .arrow { transform: translateX(2px); }

  /* 不可用态 */
  .issue-nav a.is-disabled {
    color: var(--c-line);
    pointer-events: none;
    cursor: default;
  }
  .issue-nav a.is-disabled:hover { color: var(--c-line); }
  .issue-nav a.is-disabled .arrow { transform: none; }

  /* 最后一期 */
  .issue-nav a.is-end {
    color: var(--c-line);
    pointer-events: none;
    cursor: default;
    letter-spacing: .3em;
  }
  .issue-nav a.is-end .arrow { display: none; }

  @media (max-width: 600px) {
    .gallery-container { padding: var(--sp-5) 5vw calc(var(--sp-6) * 2); }
    .specimen-list { gap: 20vh; }
    .issue-nav { padding: 0 var(--sp-2); }
    .issue-nav a { letter-spacing: .2em; }
  }
</style>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <a class="logo-swap" href="#" aria-label="0.07%">
      <span class="logo-swap__inner">
        <span class="logo-swap__line">0.07%</span>
        <span class="logo-swap__line logo-swap__line--alt">THE GOLDEN LINE</span>
      </span>
    </a>

    <div class="issue-current" id="issueCurrent">ISSUE 01</div>

    <a class="archive-link" href="#" id="archiveLink">
      ARCHIVE <span class="arrow">→</span>
    </a>
  </header>

  <div class="gallery-container">
    <div class="specimen-list" id="specimenList"></div>

    <!-- 底部：PREV / NEXT 对称 -->
    <nav class="issue-nav" id="issueNav" aria-label="Issue navigation">
      <a href="#" class="nav-prev" id="prevBtn"><span class="arrow">←</span> PREV / 01</a>
      <a href="#" class="nav-next" id="nextBtn">NEXT / 02 <span class="arrow">→</span></a>
    </nav>
  </div>

<script>
/* ===== 基础数据 ===== */
const LIGATURE_MAP = { 'Æ': 'AE', 'Œ': 'OE', 'Ø': 'O', 'ß': 'SS', 'Đ': 'D', 'Ł': 'L', 'Þ': 'TH', 'Ð': 'D', 'Ħ': 'H' };
function toBase(str) {
  let s = (str || '').toString();
  s = s.replace(/[ÆŒØßĐŁÞÐĦæœøßđłþðħ]/g, ch => LIGATURE_MAP[ch.toUpperCase()] || ch);
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.toUpperCase();
}
function getSearchKey(name) { return toBase(name); }

const brandsData = [
  { folder: 'avavav', name: 'AVAVAV', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'bed-j-w-ford', name: 'BED J.W. FORD', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'botter', name: 'BOTTER', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'burc-akyol', name: 'BURC AKYOL', images: [{ file: '01.webp', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点' }] },
  { folder: 'charles-jeffrey-loverboy', name: 'CHARLES JEFFREY LOVERBOY', images: [
    { file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 MENSWEAR', note: '' }
  ]},
  { folder: 'danielle-frankel', name: 'DANIELLE FRANKEL', images: [{ file: '01.webp', season: 'FALL 2025 READY-TO-WEAR', note: '' }] },
  { folder: 'dries-van-noten', name: 'DRIES VAN NOTEN', images: [{ file: '01.webp', season: 'FALL 2021 MENSWEAR', note: '' }] },
  { folder: 'eenk', name: 'EENK', images: [{ file: '01.webp', season: 'SPRING 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'feng-chen-wang', name: 'FENG CHEN WANG', images: [{ file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' }] },
  { folder: 'freya-dalsjo', name: 'FREYA DALSJØ', images: [
    { file: '01.webp', season: 'COPENHAGEN SPRING 2026', note: '' },
    { file: '02.webp', season: 'COPENHAGEN FALL 2026', note: '' }
  ]},
  { folder: 'harris-reed', name: 'HARRIS REED', images: [{ file: '01.webp', season: 'FALL 2022 READY-TO-WEAR', note: '头顶上的改掉' }] },
  { folder: 'loewe', name: 'LOEWE', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '仅上衣' }] },
  { folder: 'maison-mihara-yasuhiro', name: 'MAISON MIHARA YASUHIRO', images: [{ file: '01.webp', season: 'SPRING 2027 MENSWEAR', note: '去掉项链' }] },
  { folder: 'matieres-fecales', name: 'MATIÈRES FÉCALES', images: [{ file: '01.webp', season: 'SPRING 2027 READY-TO-WEAR', note: '' }] },
  { folder: 'palomo-spain', name: 'PALOMO SPAIN', images: [
    { file: '01.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '03.webp', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
  ]},
  { folder: 'robert-wun', name: 'ROBERT WUN', images: [
    { file: '01.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '02.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '03.webp', season: 'FALL 2024 COUTURE', note: '' },
    { file: '04.webp', season: 'SPRING 2024 COUTURE', note: '' }
  ]},
  { folder: 'saint-laurent', name: 'SAINT LAURENT', images: [{ file: '01.webp', season: 'SPRING 2018 READY-TO-WEAR', note: '' }] },
  { folder: 'versace', name: 'VERSACE', images: [
    { file: '01.webp', season: 'SPRING 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' },
    { file: '03.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' }
  ]},
  { folder: 'wooyoungmi', name: 'WOOYOUNGMI', images: [
    { file: '01.webp', season: 'FALL 2018 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2018 MENSWEAR', note: '内搭换掉' }
  ]}
];

brandsData.sort((a, b) => getSearchKey(a.name).localeCompare(getSearchKey(b.name), 'en'));
let allItems = [];
brandsData.forEach(brand => {
  brand.images.forEach(img => {
    allItems.push({
      src: `images/${brand.folder}/${img.file}`,
      brand: brand.name,
      season: img.season,
      note: img.note
    });
  });
});

/* ===== 分期逻辑 ===== */
const ITEMS_PER_ISSUE = 3;
const issues = [];
for (let i = 0; i < allItems.length; i += ITEMS_PER_ISSUE) {
  issues.push(allItems.slice(i, i + ITEMS_PER_ISSUE));
}
const totalIssues = issues.length;

let currentIssueIndex = 0;
const savedIssue = localStorage.getItem('currentIssueIndex');
if (savedIssue !== null && !isNaN(savedIssue)) {
  const parsed = parseInt(savedIssue, 10);
  if (parsed >= 0 && parsed < totalIssues) currentIssueIndex = parsed;
}

const specimenList = document.getElementById('specimenList');
const issueCurrent = document.getElementById('issueCurrent');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function render() {
  issueCurrent.textContent = `ISSUE ${pad2(currentIssueIndex + 1)}`;

  // 图片
  specimenList.innerHTML = '';
  const currentItems = issues[currentIssueIndex];
  currentItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'specimen';
    el.innerHTML = `
      <img src="${item.src}" alt="" draggable="false" loading="lazy">
      <div class="specimen-info">
        <div class="specimen-name">${item.brand}</div>
        <div class="specimen-season">${item.season}</div>
      </div>
    `;
    el.addEventListener('click', () => openLightbox(currentItems, currentItems.indexOf(item)));
    specimenList.appendChild(el);
  });

  // PREV 态
  if (currentIssueIndex > 0) {
    prevBtn.innerHTML = `<span class="arrow">←</span> PREV / ${pad2(currentIssueIndex)}`;
    prevBtn.classList.remove('is-disabled');
  } else {
    prevBtn.innerHTML = `<span class="arrow">←</span> PREV / 00`;
    prevBtn.classList.add('is-disabled');
  }

  // NEXT 态
  if (currentIssueIndex < totalIssues - 1) {
    nextBtn.innerHTML = `NEXT / ${pad2(currentIssueIndex + 2)} <span class="arrow">→</span>`;
    nextBtn.classList.remove('is-end');
  } else {
    nextBtn.textContent = 'END OF ARCHIVE';
    nextBtn.classList.add('is-end');
  }

  localStorage.setItem('currentIssueIndex', currentIssueIndex);
  window.scrollTo(0, 0);
}

prevBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if (currentIssueIndex > 0) {
    currentIssueIndex--;
    render();
  }
});

nextBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if (currentIssueIndex < totalIssues - 1) {
    currentIssueIndex++;
    render();
  }
});

render();

/* ===== 顶栏：下滑隐藏 / 上滑出现 / 回顶部强制显示 ===== */
(function () {
  const header = document.getElementById('siteHeader');
  const THRESHOLD = 8;
  const TOP_SAFE  = 80;

  let lastY = window.scrollY;
  let ticking = false;

  function onScroll() {
    const y = window.scrollY;
    const diff = y - lastY;

    if (y < TOP_SAFE) {
      header.classList.remove('is-hidden');
    } else if (diff > THRESHOLD) {
      header.classList.add('is-hidden');
    } else if (diff < -THRESHOLD) {
      header.classList.remove('is-hidden');
    }

    lastY = y;
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(onScroll);
      ticking = true;
    }
  }, { passive: true });
})();

/* ===== 大图预览 ===== */
const lightbox = document.createElement('div');
lightbox.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,0.98);display:none;z-index:999;cursor:pointer;outline:none;';
lightbox.innerHTML = `<img src="" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90vw;max-height:90vh;object-fit:contain;display:block;">`;
document.body.appendChild(lightbox);

const lightboxImg = lightbox.querySelector('img');
let currentImages = [];
let currentIndex = 0;

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  lightboxImg.src = currentImages[currentIndex].src;
  lightbox.style.display = 'block';
  document.body.style.overflow = 'hidden';
}
lightbox.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG') return;
  lightbox.style.display = 'none';
  document.body.style.overflow = '';
});
</script>

</body>
</html>
