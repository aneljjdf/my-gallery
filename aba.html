<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "My Font", "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #fafafa;
  color: #111;
}

.scroller {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  z-index: 10;
}

.scroller-inner {
  height: 400vh;
  pointer-events: none;
}

.intro {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}

.intro-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.1s linear, opacity 0.3s ease;
}

.word-wrap {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  pointer-events: none;
  white-space: nowrap;
}

.word {
  font-family: "Playfair Display", Georgia, serif;
  font-style: normal;
  font-weight: 500;
  font-size: 28px;
  letter-spacing: 1px;
  line-height: 1;
  display: inline-block;
  position: relative;
}

.word span {
  display: inline-block;
  position: relative;
  /* 关键：每个字母独立垂落 */
  transform: translateY(var(--drop-y, 0));
  transition: transform 0.05s linear;
}

.word-black { color: #111; }

.word-white {
  position: absolute;
  top: 0;
  left: 0;
  color: #f0f0f0;
  clip-path: inset(100% 0 0 0);
}

.strings {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.string {
  position: absolute;
  width: 1px;
  background: linear-gradient(
    to top,
    rgba(240, 240, 240, 0.65),
    rgba(240, 240, 240, 0)
  );
  transform: translate(-50%, -100%);
}

.black-cover {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 2;
  transform: translateY(100%);
  will-change: transform;
  overflow: hidden;
}

.black-text {
  position: absolute;
  left: 50%;
  bottom: 20%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 640px;
  text-align: center;
  font-size: 14px;
  line-height: 2.2;
  letter-spacing: 0.06em;
  color: #888;
  opacity: 0;
}

.outro {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.outro.show { opacity: 1; }

.outro a {
  font-size: 13px;
  letter-spacing: 0.3em;
  color: #666;
  text-decoration: none;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  pointer-events: auto;
  transition: color 0.3s, border-color 0.3s;
}

.outro a:hover { color: #111; border-color: #111; }

@media (max-width: 768px) {
  .black-text { font-size: 13px; }
  .word { font-size: 22px; }
}
</style>
</head>
<body>

<section class="intro" id="intro">
  <img class="intro-img" id="introImg" src="1999.png" alt="">
</section>

<div class="word-wrap" id="wordWrap">
  <div class="word word-black" id="wordBlack"></div>
  <div class="word word-white" id="wordWhite"></div>
  <div class="strings" id="strings"></div>
</div>

<section class="black-cover" id="blackCover">
  <div class="black-text" id="blackText">
    这里收录的，是我看过的秀场造型里，留下来的那些。<br>
    不是最好看的，是看过后还愿意留下的。<br><br>
    看过的远不止这些，这里只放留下来的。
  </div>
</section>

<div class="scroller" id="scroller">
  <div class="scroller-inner"></div>
</div>

<section class="outro" id="outro">
  <a href="index.html">回到档案</a>
</section>

<script>
const scroller = document.getElementById('scroller');
const introImg = document.getElementById('introImg');
const blackCover = document.getElementById('blackCover');
const blackText = document.getElementById('blackText');
const outro = document.getElementById('outro');
const wordWrap = document.getElementById('wordWrap');
const wordBlack = document.getElementById('wordBlack');
const wordWhite = document.getElementById('wordWhite');
const stringsEl = document.getElementById('strings');

const WORD_TEXT = 'ARCHIVE';
const DROP_FACTORS = [0.6, 1.0, 0.75, 1.2, 0.85, 1.1, 0.7];

function buildWord(el) {
  el.innerHTML = '';
  for (let i = 0; i < WORD_TEXT.length; i++) {
    const span = document.createElement('span');
    span.textContent = WORD_TEXT[i];
    el.appendChild(span);
  }
}

buildWord(wordBlack);
buildWord(wordWhite);

function buildStrings() {
  stringsEl.innerHTML = '';
  for (let i = 0; i < WORD_TEXT.length; i++) {
    const line = document.createElement('div');
    line.className = 'string';
    line.style.height = '0px';
    line.dataset.factor = DROP_FACTORS[i] || 1;
    stringsEl.appendChild(line);
  }
}

buildStrings();

function update() {
  const scrollY = scroller.scrollTop;
  const vh = window.innerHeight;
  const vw = window.innerWidth;

  const p1 = Math.min(scrollY / vh, 1);
  const p2 = Math.max(0, Math.min((scrollY - vh) / vh, 1));
  const p3 = Math.max(0, Math.min((scrollY - vh * 2) / vh, 1));

  introImg.style.filter = `blur(${p1 * 20}px)`;

  if (p3 > 0) {
    introImg.style.opacity = '0';
  } else {
    introImg.style.opacity = '1';
  }

  // 黑底
  let transform = '';

  if (p3 > 0) {
    const size = Math.min(vw, vh);
    const scale = 1 - p3 * 0.96;

    blackCover.style.width = size + 'px';
    blackCover.style.height = size + 'px';
    blackCover.style.left = '50%';
    blackCover.style.top = '50%';
    blackCover.style.borderRadius = '50%';
    transform = `translate(-50%, -50%) scale(${scale})`;
  } else {
    blackCover.style.width = '100%';
    blackCover.style.height = '100%';
    blackCover.style.left = '0';
    blackCover.style.top = '0';
    blackCover.style.borderRadius = '0';
    transform = `translateY(${(1 - p1) * 100}%)`;
  }

  blackCover.style.transform = transform;

  if (p3 > 0) {
    wordWrap.style.opacity = '0';
    blackText.style.opacity = '0';
    stringsEl.style.opacity = '0';
  } else {
    wordWrap.style.opacity = '1';
    stringsEl.style.opacity = '1';
  }

  const blackEdge = (1 - p1) * 100;

  const wordPosFollow = blackEdge + 4;
  const wordPos = Math.min(50, wordPosFollow);
  wordWrap.style.top = wordPos + '%';

  const isMobile = vw < 768;
  const fontSizeBase = isMobile ? 22 : 28;
  const maxSpacing = isMobile ? 12 : 24;

  const wordHeightPercent = (fontSizeBase / vh) * 100;
  const wordTopPercent = wordPos - wordHeightPercent / 2;
  const wordBottomPercent = wordPos + wordHeightPercent / 2;

  let passProgress = 0;
  if (blackEdge >= wordBottomPercent) {
    passProgress = 0;
  } else if (blackEdge <= wordTopPercent) {
    passProgress = 1;
  } else {
    passProgress = (wordBottomPercent - blackEdge) / wordHeightPercent;
  }

  const ease = Math.pow(passProgress, 0.5);

  const letterSpacingPx = 1 + ease * (maxSpacing - 1);
  const fontSize = fontSizeBase - ease * 6;

  wordBlack.style.fontSize = fontSize + 'px';
  wordBlack.style.letterSpacing = letterSpacingPx + 'px';
  wordBlack.style.marginRight = -(letterSpacingPx) + 'px';

  wordWhite.style.fontSize = fontSize + 'px';
  wordWhite.style.letterSpacing = letterSpacingPx + 'px';
  wordWhite.style.marginRight = -(letterSpacingPx) + 'px';

  let topClip = 100;
  if (blackEdge >= wordBottomPercent) {
    topClip = 100;
  } else if (blackEdge <= wordTopPercent) {
    topClip = 0;
  } else {
    topClip = ((blackEdge - wordTopPercent) / wordHeightPercent) * 100;
  }

  wordWhite.style.clipPath = `inset(${topClip}% 0 0 0)`;

  // ===== 垂落：每个字母独立 =====
  const dropProgress = Math.max(0, Math.min((p1 - 0.85) / 0.15, 1));

  const spans = wordWhite.querySelectorAll('span');
  spans.forEach((span, i) => {
    const factor = DROP_FACTORS[i] || 1;
    const y = dropProgress * 15 * factor;
    span.style.setProperty('--drop-y', y + 'vh');
  });

  // ===== 提线：每一帧，用字母的“垂落后的真实位置”画线 =====
  const strings = stringsEl.querySelectorAll('.string');
  const wrapRect = wordWrap.getBoundingClientRect();

  spans.forEach((span, i) => {
    const spanRect = span.getBoundingClientRect();
    const line = strings[i];
    if (!line) return;

    const centerX = spanRect.left - wrapRect.left + spanRect.width / 2;
    line.style.left = centerX + 'px';

    // 线的底部 = 字母顶部
    const topY = spanRect.top - wrapRect.top;

    // 线长：字母垂落后，从字母顶部往上，到“垂落起点”的高度
    const factor = parseFloat(line.dataset.factor) || 1;
    const lineHeight = dropProgress * 15 * factor; // vh

    line.style.top = topY + 'px';
    line.style.height = lineHeight + 'vh';
    line.style.transform = 'translate(-50%, -100%)';
  });

  if (p3 === 0) {
    const textOpacity = (p2 > 0.15) ? Math.max(0, 1 - p2 * 1.5) : 0;
    blackText.style.opacity = String(textOpacity);
  }

  if (p3 > 0.95) {
    outro.classList.add('show');
  } else {
    outro.classList.remove('show');
  }
}

function loop() {
  update();
  requestAnimationFrame(loop);
}
loop();

scroller.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
</script>

</body>
</html>
