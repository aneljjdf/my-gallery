<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "My Font", "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #fafafa;
  color: #111;
}

.scroller {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  z-index: 10;
}

.scroller-inner {
  height: 400vh;
  pointer-events: none;
}

.intro {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}

.intro-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.1s linear;
}

.word-wrap {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  pointer-events: none;
  white-space: nowrap;
}

.word {
  font-family: "Playfair Display", Georgia, serif;
  font-style: normal;
  font-weight: 500;
  font-size: 28px;
  letter-spacing: 1px;
  line-height: 1;
}

.word-black { color: #111; }

.word-white {
  position: absolute;
  top: 0;
  left: 0;
  color: #f0f0f0;
  clip-path: inset(100% 0 0 0);
}

.black-cover {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 2;
  transform: translateY(100%);
  will-change: transform;
  overflow: hidden;
}

.black-text {
  position: absolute;
  left: 50%;
  bottom: 20%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 640px;
  text-align: center;
  font-size: 14px;
  line-height: 2.2;
  letter-spacing: 0.06em;
  color: #888;
  opacity: 0;
}

.outro {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.outro.show { opacity: 1; }

.outro a {
  font-size: 13px;
  letter-spacing: 0.3em;
  color: #666;
  text-decoration: none;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  pointer-events: auto;
  transition: color 0.3s, border-color 0.3s;
}

.outro a:hover { color: #111; border-color: #111; }

@media (max-width: 768px) {
  .black-text { font-size: 13px; }
}
</style>
</head>
<body>

<section class="intro">
  <img class="intro-img" id="introImg" src="1959.png" alt="">
</section>

<div class="word-wrap" id="wordWrap">
  <div class="word word-black" id="wordBlack">ARCHIVE</div>
  <div class="word word-white" id="wordWhite">ARCHIVE</div>
</div>

<section class="black-cover" id="blackCover">
  <div class="black-text" id="blackText">
    这里收录的，是我看过的秀场造型里，留下来的那些。<br>
    不是最好看的，是看过后还愿意留下的。<br><br>
    看过的远不止这些，这里只放留下来的。
  </div>
</section>

<div class="scroller" id="scroller">
  <div class="scroller-inner"></div>
</div>

<section class="outro" id="outro">
  <a href="index.html">回到档案</a>
</section>

<script>
const scroller = document.getElementById('scroller');
const introImg = document.getElementById('introImg');
const blackCover = document.getElementById('blackCover');
const blackText = document.getElementById('blackText');
const outro = document.getElementById('outro');
const wordWrap = document.getElementById('wordWrap');
const wordBlack = document.getElementById('wordBlack');
const wordWhite = document.getElementById('wordWhite');

const BASE_FONT_SIZE = 28;
const BASE_LETTER_SPACING = 1;
const MAX_LETTER_SPACING = 24;   // 字距拉宽的上限（1 → 24px，变化更明显）

function update() {
  const scrollY = scroller.scrollTop;
  const vh = window.innerHeight;

  const p1 = Math.min(scrollY / vh, 1);
  const p2 = Math.max(0, Math.min((scrollY - vh) / vh, 1));
  const p3 = Math.max(0, Math.min((scrollY - vh * 2) / vh, 1));

  introImg.style.filter = `blur(${p1 * 14}px) brightness(${1 - p1 * 0.4})`;

  // 黑底
  let transform = '';

  if (p3 > 0) {
    const size = Math.min(window.innerWidth, vh);
    const scale = 1 - p3 * 0.96;

    blackCover.style.width = size + 'px';
    blackCover.style.height = size + 'px';
    blackCover.style.left = '50%';
    blackCover.style.top = '50%';
    blackCover.style.borderRadius = '50%';
    transform = `translate(-50%, -50%) scale(${scale})`;
  } else {
    blackCover.style.width = '100%';
    blackCover.style.height = '100%';
    blackCover.style.left = '0';
    blackCover.style.top = '0';
    blackCover.style.borderRadius = '0';
    transform = `translateY(${(1 - p1) * 100}%)`;
  }

  blackCover.style.transform = transform;

  // 黑底边缘
  const blackEdge = (1 - p1) * 100;

  // 字的位置：跟着黑底边缘走
  const wordPosFollow = blackEdge + 4;
  const wordPos = Math.min(50, wordPosFollow);

  wordWrap.style.top = wordPos + '%';

  // 用固定基准字号，算字高
  const wordHeightPercent = (BASE_FONT_SIZE / vh) * 100;
  const wordTopPercent = wordPos - wordHeightPercent / 2;
  const wordBottomPercent = wordPos + wordHeightPercent / 2;

  // ===== 变化进度：从“黑底边缘碰到字底部”开始，到“完全过字顶部”结束 =====
  let passProgress = 0;
  if (blackEdge >= wordBottomPercent) {
    passProgress = 0;
  } else if (blackEdge <= wordTopPercent) {
    passProgress = 1;
  } else {
    passProgress = (wordBottomPercent - blackEdge) / wordHeightPercent;
  }

  // ===== 变化拉长：用 easeOut，开头慢、后面快 =====
  // passProgress 在字高范围内只占很小一段，通过平方根放大它在视觉上的“慢”
  // 同时，p1 全程参与，让它不只是“碰到才变”
  // 混合：主要在 passProgress，但辅以 p1 的平滑
  const ease = Math.pow(passProgress, 0.5);   // 平方根：前段变化更细

  // ===== 字距：1 → 24px，用 ease 控制 =====
  const letterSpacingPx = BASE_LETTER_SPACING + ease * (MAX_LETTER_SPACING - BASE_LETTER_SPACING);

  // ===== 字号：28 → 22（只微缩，保持高级） =====
  const fontSize = 28 - ease * 6;

  wordBlack.style.fontSize = fontSize + 'px';
  wordBlack.style.letterSpacing = letterSpacingPx + 'px';
  wordWhite.style.fontSize = fontSize + 'px';
  wordWhite.style.letterSpacing = letterSpacingPx + 'px';

  // ===== 白层露出：用基准字高精确对齐黑底边缘 =====
  let topClip = 100;
  if (blackEdge >= wordBottomPercent) {
    topClip = 100;
  } else if (blackEdge <= wordTopPercent) {
    topClip = 0;
  } else {
    topClip = ((blackEdge - wordTopPercent) / wordHeightPercent) * 100;
  }

  wordWhite.style.clipPath = `inset(${topClip}% 0 0 0)`;

  // 黑底文字
  const textOpacity = (p2 > 0.15) ? Math.max(0, 1 - p3 * 1.5) : 0;
  blackText.style.opacity = String(textOpacity);

  // 白底
  if (p3 > 0.95) {
    outro.classList.add('show');
  } else {
    outro.classList.remove('show');
  }
}

scroller.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
update();
</script>

</body>
</html>
