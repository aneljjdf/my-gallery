<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>为这个领域，划一条金线。</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: "EB Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .cube-wrap {
    padding: 20vh 10vw;
    max-width: 1200px;
    margin: 0 auto;
  }
  .title {
    font-family: "EB Garamond", "Noto Sans SC", Georgia, serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.5;
    text-align: justify;
    max-width: 280px;
    margin: 0 auto;
    margin-bottom: 25vh;
  }
  .title .line { display: block; }
  .title .line2 { text-align-last: justify; }
  .subtitle {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-align: center;
    text-transform: uppercase;
    color: #999;
    margin-top: 16px;
  }
  .specimen-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25vh;
  }
  .specimen {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }
  .specimen img {
    width: 100%;
    height: auto;
    display: block;
    filter: grayscale(10%) contrast(105%);
  }
  .specimen-info {
    margin-top: 24px;
  }
  .specimen-name {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .specimen-season {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #888;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .data-block {
    margin-top: 30vh;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.2em;
    line-height: 3;
    color: #333;
  }

  @media (max-width: 600px) {
    .cube-wrap { padding: 14vh 6vw; }
    .title {
      font-size: 22px;
      letter-spacing: 0.02em;
      max-width: 280px;
      margin-bottom: 14vh;
    }
    .subtitle { letter-spacing: 0.24em; }
    .specimen-list { gap: 16vh; }
    .data-block {
      margin-top: 18vh;
      letter-spacing: 0.14em;
      line-height: 2.6;
    }
  }
</style>
</head>
<body>
  <div class="cube-wrap">
    <div class="title">
      <span class="line line1">为这个领域，</span>
      <span class="line line2">划一条金线。</span>
    </div>
    <div class="subtitle">显影室 / 0.07%</div>

    <div class="specimen-list" style="margin-top: 20vh;">
      <div class="specimen">
        <img src="images/loewe/01.webp" alt="">
        <div class="specimen-info">
          <div class="specimen-name">LOEWE</div>
          <div class="specimen-season">FALL 2024 READY-TO-WEAR</div>
        </div>
      </div>
      <div class="specimen">
        <img src="images/robert-wun/01.webp" alt="">
        <div class="specimen-info">
          <div class="specimen-name">ROBERT WUN</div>
          <div class="specimen-season">SPRING 2026 COUTURE</div>
        </div>
      </div>
    </div>

    <div class="data-block">
      <div>阅过造型 600,000+</div>
      <div>金线之上 500+</div>
      <div>成立率 0.07%</div>
    </div>
  </div>
</body>
</html>
