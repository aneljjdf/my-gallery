<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive 档案</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: "My Font", "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #fafafa;
  color: #333;
  line-height: 1.7;
  padding: 0 24px 120px;
  -webkit-font-smoothing: antialiased;
}

img {
  -webkit-user-drag: none;
  pointer-events: auto;
}

input {
  -webkit-user-select: text;
  user-select: text;
}

/* ===== 开屏 ===== */
.splash {
  position: fixed;
  inset: 0;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: bgOut 0.6s ease 2.6s forwards;
}

.splash span {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 46px;
  letter-spacing: 0.02em;
  color: #c8c8c8;
  opacity: 0;
  filter: blur(8px);
  animation: blurIn 1s ease forwards, textOut 0.6s ease 2s forwards;
}

@keyframes blurIn { to { opacity: 1; filter: blur(0); } }
@keyframes textOut { to { opacity: 0; filter: blur(6px); } }
@keyframes bgOut { to { opacity: 0; visibility: hidden; } }

/* ===== 顶栏 ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250, 250, 250, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 0 -24px 40px;
  padding: 14px 24px;
}

.topbar .logo {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #111;
  flex-shrink: 0;
}

.topbar .search-btn {
  font-size: 12px;
  letter-spacing: 0.2em;
  color: #666;
  cursor: pointer;
  transition: color 0.3s;
  user-select: none;
}

.topbar .search-btn:hover { color: #111; }

/* ===== 容器 ===== */
.container { max-width: 1200px; margin: 0 auto; }

.page-header { text-align: center; margin-bottom: 60px; }

.page-header h1 {
  font-size: 24px;
  font-weight: 400;
  letter-spacing: 0.5em;
  color: #333;
  margin-bottom: 16px;
}

.page-header .sub {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: #aaa;
}

/* ===== 品牌网格 ===== */
.brand-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px 24px;
}

.brand-card { cursor: pointer; }

.brand-cover {
  position: relative;
  aspect-ratio: 4 / 5;
  background: #ececec;
  overflow: hidden;
  margin-bottom: 16px;
}

.brand-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
  pointer-events: none;
}

.brand-card:hover .brand-cover img { transform: scale(1.03); }

.brand-name {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: #222;
  margin-bottom: 6px;
}

.brand-count {
  font-size: 11px;
  color: #bbb;
  letter-spacing: 0.1em;
}

/* ===== 全屏搜索页 ===== */
.search-page {
  position: fixed;
  inset: 0;
  background: rgba(250, 250, 250, 0.98);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 500;
  display: none;
  overflow-y: auto;
  padding: 60px 24px 120px;
}

.search-page.active { display: block; }

.search-page-inner {
  max-width: 900px;
  margin: 0 auto;
}

.search-page-input-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.2);
  padding-bottom: 10px;
  margin-bottom: 30px;
}

.search-page-input-wrap svg {
  width: 18px;
  height: 18px;
  stroke: #999;
  flex-shrink: 0;
}

.search-page-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.1em;
  color: #222;
}

.search-page-input::placeholder { color: #ccc; letter-spacing: 0.1em; }

.search-page-clear {
  display: none;
  width: 16px;
  height: 16px;
  stroke: #999;
  cursor: pointer;
  flex-shrink: 0;
  transition: stroke 0.2s;
}

.search-page-clear:hover { stroke: #111; }
.search-page-clear.show { display: block; }

.alpha-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-bottom: 40px;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #ccc;
}

.alpha-bar span {
  cursor: pointer;
  transition: color 0.2s;
  user-select: none;
}

.alpha-bar span:hover { color: #111; }

.alpha-bar span.has-brand { color: #333; }

.search-brand-list {
  display: flex;
  flex-direction: column;
}

.search-brand-item {
  font-size: 14px;
  letter-spacing: 0.1em;
  color: #555;
  padding: 16px 0;
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  cursor: pointer;
  transition: color 0.25s, padding-left 0.25s;
  user-select: none;
}

.search-brand-item:hover {
  color: #111;
  padding-left: 8px;
}

.alpha-group-title {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: #bbb;
  margin-top: 30px;
  margin-bottom: 4px;
}

.alpha-group-title:first-child { margin-top: 0; }

/* ===== 展开层 ===== */
.expand-layer {
  position: fixed;
  inset: 0;
  background: rgba(250, 250, 250, 0.98);
  z-index: 100;
  display: none;
  overflow-y: auto;
  padding: 60px 24px 120px;
}

.expand-layer.active { display: block; }

.expand-inner { max-width: 1200px; margin: 0 auto; }

.expand-header {
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 1px solid #e6e6e6;
  text-align: center;
}

.expand-title {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: #222;
}

.expand-images {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 240px));
  gap: 20px;
  justify-content: start;
}

.expand-images .thumb {
  position: relative;
  aspect-ratio: 4 / 5;
  background: #ececec;
  overflow: hidden;
  cursor: pointer;
  transition: opacity 0.3s;
}

.expand-images .thumb:hover { opacity: 0.7; }

.expand-images .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.expand-images .thumb-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.6));
  color: #fff;
  font-size: 11px;
  letter-spacing: 0.1em;
  pointer-events: none;
}

/* ===== 大图预览 ===== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 20, 0.96);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  cursor: pointer;
}

.lightbox.active { display: flex; }

.lightbox-img {
  max-width: 80vw;
  max-height: 76vh;
  object-fit: contain;
  cursor: default;
}

/* 底部：只留一句话，居中、浅灰、跟图留空 */
.lightbox-caption {
  position: absolute;
  bottom: 6vh;
  left: 0;
  right: 0;
  text-align: center;
  color: #aaa;
  font-size: 11px;
  letter-spacing: 0.15em;
  cursor: default;
  padding: 0 24px;
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 30px;
  cursor: pointer;
  user-select: none;
  opacity: 0.6;
  transition: opacity 0.2s;
}

.lightbox-arrow:hover { opacity: 1; }
.lightbox-arrow.prev { left: 30px; }
.lightbox-arrow.next { right: 30px; }

.lightbox-counter {
  position: absolute;
  top: 34px;
  left: 40px;
  color: #888;
  font-size: 12px;
  letter-spacing: 0.2em;
  cursor: default;
}

/* ===== 页脚 ===== */
.footer {
  margin-top: 120px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #bbb;
  line-height: 2.4;
}

.footer .links { margin-top: 10px; }

.footer .links a {
  color: #bbb;
  text-decoration: none;
  margin: 0 8px;
  transition: color 0.3s ease;
}

.footer .links a:hover { color: #555; }

/* ===== 回到顶部 ===== */
.to-top {
  position: fixed;
  right: 28px;
  bottom: 28px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #999;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 200;
  user-select: none;
}

.to-top.show { opacity: 0.7; pointer-events: auto; }
.to-top:hover { opacity: 1; }

/* ===== 手机 ===== */
@media (max-width: 768px) {
  body { padding: 0 16px 80px; }

  .topbar {
    margin: 0 -16px 30px;
    padding: 12px 16px;
    gap: 12px;
  }

  .topbar .logo { font-size: 14px; }
  .topbar .search-btn { font-size: 11px; }

  .page-header { margin-bottom: 40px; }
  .page-header h1 { font-size: 18px; letter-spacing: 0.3em; }

  .brand-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 28px 14px;
  }

  .brand-name { font-size: 14px; }
  .brand-count { font-size: 10px; }

  .search-page { padding: 40px 16px 80px; }
  .search-page-input { font-size: 15px; }
  .alpha-bar { gap: 4px 8px; font-size: 10px; }
  .search-brand-item { font-size: 13px; padding: 14px 0; }

  .expand-layer { padding: 40px 16px 80px; }
  .expand-title { font-size: 18px; }

  .expand-images {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    justify-content: stretch;
  }

  .lightbox-img { max-width: 92vw; max-height: 68vh; }
  .lightbox-arrow { font-size: 24px; }
  .lightbox-arrow.prev { left: 12px; }
  .lightbox-arrow.next { right: 12px; }
  .lightbox-caption { bottom: 8vh; font-size: 10px; }

  .footer { margin-top: 80px; font-size: 10px; }
  .to-top { right: 16px; bottom: 16px; width: 32px; height: 32px; font-size: 16px; }
}
</style>
</head>
<body>

<div class="splash">
  <span>Archive</span>
</div>

<header class="topbar">
  <div class="logo">ARCHIVE</div>
  <div class="search-btn" id="searchBtn">SEARCH</div>
</header>

<div class="container">

  <header class="page-header">
    <h1>ARCHIVE</h1>
    <div class="sub">留下值得的</div>
  </header>

  <div class="brand-grid" id="brandGrid"></div>

  <div class="footer" id="footer"></div>
  <div class="footer links">
    <a href="about.html">ABOUT</a>
    <span>·</span>
    <a href="contact.html">CONTACT</a>
  </div>

</div>

<div class="to-top" id="toTop">↑</div>

<!-- ===== 全屏搜索页 ===== -->
<div class="search-page" id="searchPage">
  <div class="search-page-inner">

    <div class="search-page-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
      </svg>
      <input type="text" class="search-page-input" id="searchPageInput" placeholder="SEARCH" autocomplete="off">
      <svg class="search-page-clear" id="searchPageClear" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </div>

    <div class="alpha-bar" id="alphaBar"></div>

    <div class="search-brand-list" id="searchBrandList"></div>

  </div>
</div>

<!-- ===== 大图预览 ===== -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-counter" id="counter">1 / 1</div>
  <div class="lightbox-arrow prev" id="prev">‹</div>
  <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
  <div class="lightbox-arrow next" id="next">›</div>
  <div class="lightbox-caption" id="captionNote"></div>
</div>

<script>
/* ===== 数据 ===== */
const brandsData = [
  {
    folder: 'burc-akyol',
    name: 'BURC AKYOL',
    images: [
      { file: '01.jpg', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点就好了' }
    ]
  },
  {
    folder: 'feng-chen-wang',
    name: 'FENG CHEN WANG',
    images: [
      { file: '01.jpg', season: 'SPRING 2025 MENSWEAR', note: '' }
    ]
  },
  {
    folder: 'palomo-spain',
    name: 'PALOMO SPAIN',
    images: [
      { file: '01.jpg', season: 'FALL 2023 READY-TO-WEAR', note: '' },
      { file: '02.jpg', season: 'FALL 2023 READY-TO-WEAR', note: '' },
      { file: '03.jpg', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
    ]
  }
];

brandsData.forEach((b, i) => {
  b.expand = 'expand-' + i;
});

/* ===== 品牌网格：生成卡片 + 展开层 ===== */
const brandGrid = document.getElementById('brandGrid');

brandsData.forEach(brand => {
  const card = document.createElement('div');
  card.className = 'brand-card';
  card.dataset.name = brand.name;
  card.onclick = () => openExpand(brand.expand);

  const cover = brand.images[0];
  card.innerHTML = `
    <div class="brand-cover">
      <img src="images/${brand.folder}/${cover.file}" alt="" loading="lazy" draggable="false">
    </div>
    <div class="brand-name">${brand.name}</div>
    <div class="brand-count">${brand.images.length} ${brand.images.length > 1 ? 'looks' : 'look'}</div>
  `;
  brandGrid.appendChild(card);

  const layer = document.createElement('div');
  layer.className = 'expand-layer';
  layer.id = brand.expand;

  const thumbsHTML = brand.images.map((img) => {
    return `
      <div class="thumb" data-brand="${brand.name}" data-season="${img.season}" data-note="${img.note}">
        <img src="images/${brand.folder}/${img.file}" alt="" loading="lazy" draggable="false">
        <div class="thumb-label">${img.season}</div>
      </div>
    `;
  }).join('');

  layer.innerHTML = `
    <div class="expand-inner">
      <div class="expand-header">
        <div class="expand-title">${brand.name}</div>
      </div>
      <div class="expand-images">
        ${thumbsHTML}
      </div>
    </div>
  `;
  document.body.appendChild(layer);
});

/* ===== 全屏搜索页元素 ===== */
const searchPage = document.getElementById('searchPage');
const searchBtn = document.getElementById('searchBtn');
const searchPageInput = document.getElementById('searchPageInput');
const searchPageClear = document.getElementById('searchPageClear');
const alphaBar = document.getElementById('alphaBar');
const searchBrandList = document.getElementById('searchBrandList');

/* ===== 分层回退标记 ===== */
let expandFromSearch = false;

/* ===== 展开层 ===== */
function openExpand(id) {
  const layer = document.getElementById(id);
  layer.classList.add('active');
  document.body.style.overflow = 'hidden';

  if (searchPage.classList.contains('active')) {
    expandFromSearch = true;
    searchPage.classList.remove('active');
  } else {
    expandFromSearch = false;
  }
}

function closeExpand(id) {
  document.getElementById(id).classList.remove('active');

  if (expandFromSearch) {
    searchPage.classList.add('active');
    expandFromSearch = false;
  } else {
    document.body.style.overflow = '';
  }
}

document.querySelectorAll('.expand-layer').forEach(layer => {
  layer.addEventListener('click', (e) => {
    if (e.target.closest('.thumb')) return;
    closeExpand(layer.id);
  });
});

/* ===== 大图预览 ===== */
let currentImages = [];
let currentIndex = 0;

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const captionNote = document.getElementById('captionNote');
const counter = document.getElementById('counter');

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const img = currentImages[currentIndex];
  lightboxImg.src = img.src;
  captionNote.textContent = img.note || '';
  counter.textContent = (currentIndex + 1) + ' / ' + currentImages.length;
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateLightbox();
}

function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateLightbox();
}

document.querySelectorAll('.expand-layer').forEach(layer => {
  const thumbs = Array.from(layer.querySelectorAll('.thumb'));
  const imgList = thumbs.map(t => ({
    src: t.querySelector('img').src,
    brand: t.dataset.brand || '',
    season: t.dataset.season || '',
    note: t.dataset.note || ''
  }));

  thumbs.forEach((thumb, i) => {
    thumb.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(imgList, i);
    });
  });
});

lightbox.addEventListener('click', (e) => {
  if (e.target.classList.contains('lightbox-img')) return;
  if (e.target.closest('.lightbox-arrow')) return;
  closeLightbox();
});

document.getElementById('prev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevImage();
});
document.getElementById('next').addEventListener('click', (e) => {
  e.stopPropagation();
  nextImage();
});

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'Escape') closeLightbox();
  } else if (document.querySelector('.expand-layer.active')) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.expand-layer.active').forEach(l => l.classList.remove('active'));
      document.body.style.overflow = '';
    }
  } else if (searchPage.classList.contains('active')) {
    if (e.key === 'Escape') closeSearchPage();
  }
});

/* ===== 底部数字 ===== */
const totalBrands = brandsData.length;
const totalImages = brandsData.reduce((sum, b) => sum + b.images.length, 0);
document.getElementById('footer').textContent =
  totalBrands + ' 个品牌 · ' + totalImages + ' 张图';

/* ===== 回到顶部 ===== */
const toTop = document.getElementById('toTop');

window.addEventListener('scroll', () => {
  if (window.scrollY > 400) {
    toTop.classList.add('show');
  } else {
    toTop.classList.remove('show');
  }
});

toTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ===== 搜索页打开 / 关闭 ===== */
searchBtn.addEventListener('click', () => {
  searchPage.classList.add('active');
  document.body.style.overflow = 'hidden';
});

function closeSearchPage() {
  searchPage.classList.remove('active');
  document.body.style.overflow = '';
  searchPageInput.value = '';
  searchPageClear.classList.remove('show');
  renderBrandList('');
}

/* ===== 生成 A–Z ===== */
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

function getBrandLetter(b) {
  const parts = b.name.trim().split(' ');
  const last = parts[parts.length - 1] || b.name;
  return (last[0] || '').toUpperCase();
}

const existingLetters = new Set(
  brandsData.map(b => getBrandLetter(b))
);

ALPHA.forEach(letter => {
  const span = document.createElement('span');
  span.textContent = letter;
  span.dataset.letter = letter;
  if (existingLetters.has(letter)) span.classList.add('has-brand');
  span.addEventListener('click', () => {
    const target = document.querySelector('.alpha-group-title[data-letter="' + letter + '"]');
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  alphaBar.appendChild(span);
});

/* ===== 渲染品牌列表 ===== */
function renderBrandList(keyword) {
  keyword = (keyword || '').trim().toUpperCase();
  searchBrandList.innerHTML = '';

  const filtered = brandsData.filter(b =>
    !keyword || b.name.toUpperCase().includes(keyword)
  );

  const grouped = {};
  filtered.forEach(b => {
    const letter = getBrandLetter(b);
    if (!grouped[letter]) grouped[letter] = [];
    grouped[letter].push(b);
  });

  const letters = Object.keys(grouped).sort();

  if (letters.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-brand-item';
    empty.style.cursor = 'default';
    empty.style.color = '#ccc';
    empty.textContent = '没有匹配的品牌';
    searchBrandList.appendChild(empty);
    return;
  }

  letters.forEach(letter => {
    const title = document.createElement('div');
    title.className = 'alpha-group-title';
    title.dataset.letter = letter;
    title.textContent = letter;
    searchBrandList.appendChild(title);

    grouped[letter].forEach(b => {
      const item = document.createElement('div');
      item.className = 'search-brand-item';
      item.textContent = b.name;
      item.addEventListener('click', () => {
        openExpand(b.expand);
      });
      searchBrandList.appendChild(item);
    });
  });
}

renderBrandList('');

/* ===== 搜索页输入 ===== */
searchPageInput.addEventListener('input', () => {
  const v = searchPageInput.value;
  renderBrandList(v);
  searchPageClear.classList.toggle('show', v.length > 0);
});

searchPageClear.addEventListener('click', () => {
  searchPageInput.value = '';
  searchPageClear.classList.remove('show');
  renderBrandList('');
});

searchPageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchPageInput.value = '';
    searchPageClear.classList.remove('show');
    renderBrandList('');
    searchPageInput.blur();
  }
});

/* ===== 搜索页点空白 → 回主页 ===== */
searchPage.addEventListener('click', (e) => {
  if (e.target.closest('.search-brand-item')) return;
  if (e.target.closest('.search-page-input-wrap')) return;
  if (e.target.closest('.alpha-bar')) return;
  if (e.target.closest('.alpha-group-title')) return;
  closeSearchPage();
});

/* ===== 品牌卡 A→Z 排序 ===== */
const cards = Array.from(brandGrid.querySelectorAll('.brand-card'));

cards.sort((a, b) => {
  const nameA = (a.dataset.name || '').toUpperCase();
  const nameB = (b.dataset.name || '').toUpperCase();
  return nameA.localeCompare(nameB, 'en');
});

cards.forEach(card => brandGrid.appendChild(card));
</script>

</body>
</html>
