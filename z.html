<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标准 / 真理</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "My Font";
  src: url("./fonts/myfont.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: "Inter", "Noto Sans SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #f0efed;
  color: #1a1a1a;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  font-weight: 400;
}

img {
  -webkit-user-drag: none;
  pointer-events: auto;
}

/* ===== 吸顶栏 ===== */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 40px;
  pointer-events: none;
}

.topbar .logo {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.4em;
  color: #1a1a1a;
  text-transform: uppercase;
  pointer-events: auto;
}

/* ===== 页边距 ===== */
.page {
  padding: 0 40px 160px;
}

@media (max-width: 768px) {
  .page {
    padding: 0 5% 120px;
  }
}

/* ===== 开头（衬线）===== */
.opening {
  padding-top: 22vh;
  padding-bottom: 18vh;
  text-align: center;
}

.opening .line-main {
  font-family: "EB Garamond", "Noto Sans SC", Georgia, serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: #1a1a1a;
  line-height: 1.6;
}

.opening .line-sub {
  margin-top: 22px;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.35em;
  color: #9a9a97;
  line-height: 2;
  text-transform: uppercase;
}

@media (max-width: 768px) {
  .opening {
    padding-top: 18vh;
    padding-bottom: 14vh;
  }
  .opening .line-main {
    font-size: 20px;
    letter-spacing: 0.06em;
  }
  .opening .line-sub {
    font-size: 10px;
    letter-spacing: 0.3em;
  }
}

/* ===== 图墙：回到之前那版 ===== */
.wall {
  max-width: 1400px;
  margin: 0 auto;
}

.wall-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 6%;
  align-items: start;
}

.wall-col {
  display: flex;
  flex-direction: column;
  gap: 12vh;
}

/* 右列整体往下错开 */
.wall-col.col-right {
  margin-top: 16vh;
}

/* 每张图：占列宽 88% */
.wall-item {
  width: 88%;
  cursor: pointer;
  opacity: 0.01;
  transform: translateY(30px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  will-change: opacity, transform;
}

.wall-item.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* 左列：图靠右（往中间靠） */
.wall-col.col-left .wall-item {
  margin-left: auto;
  margin-right: 0;
}

/* 右列：图靠左（往中间靠） */
.wall-col.col-right .wall-item {
  margin-left: 0;
  margin-right: auto;
}

.wall-item .wall-frame {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.wall-item .wall-frame img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.wall-item:hover .wall-frame img {
  opacity: 0.86;
}

.wall-item .wall-name {
  margin-top: 16px;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.22em;
  color: #1a1a1a;
  text-transform: uppercase;
}

.wall-item .wall-season {
  margin-top: 4px;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: #9a9a97;
  text-transform: uppercase;
}

.wall-item.hidden {
  display: none;
}

@media (max-width: 768px) {
  .wall-grid {
    display: block;
  }

  .wall-col {
    display: contents;
  }

  .wall-col.col-right {
    margin-top: 0;
  }

  .wall-item {
    width: 100%;
    margin: 0 0 22vh 0 !important;
  }

  .wall-item .wall-name {
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 0.2em;
  }

  .wall-item .wall-season {
    font-size: 9px;
  }
}

/* ===== 展开入口 ===== */
.expand-entry {
  text-align: center;
  margin-top: 18vh;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.35em;
  color: #9a9a97;
  text-transform: uppercase;
  transition: color 0.3s ease;
  user-select: none;
}

.expand-entry:hover {
  color: #1a1a1a;
}

@media (max-width: 768px) {
  .expand-entry {
    margin-top: 16vh;
    font-size: 10px;
    letter-spacing: 0.3em;
  }
}

/* ===== 声明区（全部左对齐，全黑）===== */
.statement {
  max-width: 640px;
  margin: 0 auto;
  padding-top: 22vh;
  text-align: left;
}

.statement .block + .block {
  margin-top: 9vh;
}

.statement .data,
.statement .claim,
.statement .footnote {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.25em;
  line-height: 2.6;
  color: #1a1a1a;
}

@media (max-width: 768px) {
  .statement {
    padding-top: 18vh;
  }
  .statement .block + .block {
    margin-top: 8vh;
  }
  .statement .data,
  .statement .claim,
  .statement .footnote {
    font-size: 11px;
    letter-spacing: 0.2em;
  }
}

/* ===== 页脚 ===== */
.footer {
  margin-top: 20vh;
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.3em;
  color: #b0b0ad;
  line-height: 2.6;
  text-transform: uppercase;
  font-weight: 300;
}

@media (max-width: 768px) {
  .footer {
    margin-top: 16vh;
    font-size: 8px;
    letter-spacing: 0.24em;
  }
}

/* ===== 大图预览 ===== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.97);
  display: none;
  z-index: 999;
  cursor: pointer;
}

.lightbox.active {
  display: block;
}

.lightbox-img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 80vw;
  max-height: 69vh;
  object-fit: contain;
  cursor: default;
  display: block;
}

.lightbox-caption {
  position: absolute;
  bottom: 6vh;
  left: 0;
  right: 0;
  text-align: center;
  cursor: default;
  padding: 0 40px;
}

.lightbox-caption .label {
  font-family: "Inter", sans-serif;
  font-style: normal;
  font-weight: 400;
  font-size: 10px;
  letter-spacing: 0.4em;
  color: #777;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.lightbox-caption .note {
  font-family: "Noto Sans SC", -apple-system, "Microsoft YaHei", sans-serif;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #b8b8b8;
  font-weight: 300;
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  user-select: none;
  opacity: 0.4;
  transition: opacity 0.2s;
  font-weight: 200;
}

.lightbox-arrow:hover {
  opacity: 1;
}

.lightbox-arrow.prev {
  left: 36px;
}

.lightbox-arrow.next {
  right: 36px;
}

.lightbox-meta {
  position: absolute;
  top: 40px;
  left: 48px;
  color: #777;
  font-size: 10px;
  letter-spacing: 0.3em;
  cursor: default;
  text-transform: uppercase;
  font-weight: 400;
}

@media (max-width: 768px) {
  .topbar {
    padding: 18px 20px;
  }
  .topbar .logo {
    font-size: 11px;
  }
  .lightbox-img {
    max-width: 92vw;
    max-height: 68vh;
  }
  .lightbox-arrow {
    font-size: 20px;
  }
  .lightbox-arrow.prev {
    left: 12px;
  }
  .lightbox-arrow.next {
    right: 12px;
  }
  .lightbox-meta {
    top: 24px;
    left: 20px;
    font-size: 9px;
  }
  .lightbox-caption {
    bottom: 5vh;
    padding: 0 24px;
  }
  .lightbox-caption .label {
    font-size: 9px;
    margin-bottom: 8px;
  }
  .lightbox-caption .note {
    font-size: 11px;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">标准 / 真理</div>
</header>

<div class="page">

  <!-- ===== 开头 ===== -->
  <div class="opening">
    <div class="line-main">这是一个形式真理的显影场</div>
    <div class="line-sub">没有可套用的标准，只有真理的显形</div>
  </div>

  <!-- ===== 图墙 ===== -->
  <div class="wall">
    <div class="wall-grid">
      <div class="wall-col col-left" id="colLeft"></div>
      <div class="wall-col col-right" id="colRight"></div>
    </div>
  </div>

  <!-- ===== 展开入口 ===== -->
  <div class="expand-entry" id="expandEntry">展开 ▶</div>

  <!-- ===== 声明区 ===== -->
  <div class="statement">
    <div class="block data">每百场秀，在这里有 0.2% 的通过率。<br>这里只放成立的。</div>
    <div class="block claim">
      门槛在标准本身。<br>
      上千张造型，才可能筛出一张符合标准的。<br>
      要得到结果，需要拿出足够的体量，并接受绝对标准。
    </div>
    <div class="block footnote">
      这是一个形式真理的显影场，标准显形的地方。<br>
      天赋者服务于这个真理。不是表达自己，是呈现形式本身的对错。
    </div>
  </div>

  <!-- ===== 页脚 ===== -->
  <div class="footer">
    All runway images © their respective owners.<br>
    Archive judgments by [名字].
  </div>

</div>

<!-- ===== 大图预览 ===== -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-meta" id="lightboxMeta"></div>
  <div class="lightbox-arrow prev" id="prev">‹</div>
  <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
  <div class="lightbox-arrow next" id="next">›</div>
  <div class="lightbox-caption" id="captionBox"></div>
</div>

<script>
/* ===== 变音符号降级 ===== */
const LIGATURE_MAP = {
  'Æ': 'AE', 'Œ': 'OE', 'Ø': 'O', 'ß': 'SS',
  'Đ': 'D', 'Ł': 'L', 'Þ': 'TH', 'Ð': 'D', 'Ħ': 'H'
};

function toBase(str) {
  let s = (str || '').toString();
  s = s.replace(/[ÆŒØßĐŁÞÐĦæœøßđłþðħ]/g, ch => LIGATURE_MAP[ch.toUpperCase()] || ch);
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.toUpperCase();
}

function getSearchKey(name) {
  return toBase(name);
}

/* ===== 数据 ===== */
const brandsData = [
  { folder: 'avavav', name: 'AVAVAV', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'bed-j-w-ford', name: 'BED J.W. FORD', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'botter', name: 'BOTTER', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'burc-akyol', name: 'BURC AKYOL', images: [{ file: '01.webp', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点' }] },
  { folder: 'charles-jeffrey-loverboy', name: 'CHARLES JEFFREY LOVERBOY', images: [
    { file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 MENSWEAR', note: '' }
  ]},
  { folder: 'danielle-frankel', name: 'DANIELLE FRANKEL', images: [{ file: '01.webp', season: 'FALL 2025 READY-TO-WEAR', note: '' }] },
  { folder: 'dries-van-noten', name: 'DRIES VAN NOTEN', images: [{ file: '01.webp', season: 'FALL 2021 MENSWEAR', note: '' }] },
  { folder: 'eenk', name: 'EENK', images: [{ file: '01.webp', season: 'SPRING 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'feng-chen-wang', name: 'FENG CHEN WANG', images: [{ file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' }] },
  { folder: 'freya-dalsjo', name: 'FREYA DALSJØ', images: [
    { file: '01.webp', season: 'COPENHAGEN SPRING 2026', note: '' },
    { file: '02.webp', season: 'COPENHAGEN FALL 2026', note: '' }
  ]},
  { folder: 'harris-reed', name: 'HARRIS REED', images: [{ file: '01.webp', season: 'FALL 2022 READY-TO-WEAR', note: '头顶上的改掉' }] },
  { folder: 'loewe', name: 'LOEWE', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '仅上衣' }] },
  { folder: 'maison-mihara-yasuhiro', name: 'MAISON MIHARA YASUHIRO', images: [{ file: '01.webp', season: 'SPRING 2027 MENSWEAR', note: '去掉项链' }] },
  { folder: 'matieres-fecales', name: 'MATIÈRES FÉCALES', images: [{ file: '01.webp', season: 'SPRING 2027 READY-TO-WEAR', note: '' }] },
  { folder: 'palomo-spain', name: 'PALOMO SPAIN', images: [
    { file: '01.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '03.webp', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
  ]},
  { folder: 'robert-wun', name: 'ROBERT WUN', images: [
    { file: '01.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '02.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '03.webp', season: 'FALL 2024 COUTURE', note: '' },
    { file: '04.webp', season: 'SPRING 2024 COUTURE', note: '' }
  ]},
  { folder: 'saint-laurent', name: 'SAINT LAURENT', images: [{ file: '01.webp', season: 'SPRING 2018 READY-TO-WEAR', note: '' }] },
  { folder: 'versace', name: 'VERSACE', images: [
    { file: '01.webp', season: 'SPRING 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' },
    { file: '03.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' }
  ]},
  { folder: 'wooyoungmi', name: 'WOOYOUNGMI', images: [
    { file: '01.webp', season: 'FALL 2018 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2018 MENSWEAR', note: '内搭换掉' }
  ]}
];

brandsData.sort((a, b) =>
  getSearchKey(a.name).localeCompare(getSearchKey(b.name), 'en')
);

/* ===== 拍平 ===== */
const allItems = [];

brandsData.forEach(brand => {
  brand.images.forEach(img => {
    allItems.push({
      src: `images/${brand.folder}/${img.file}`,
      brand: brand.name,
      season: img.season,
      note: img.note
    });
  });
});

/* ===== 收起张数 ===== */
function collapseCount() {
  return window.matchMedia('(max-width: 768px)').matches ? 10 : 12;
}

/* ===== 渐入观察器 ===== */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('revealed');
      revealObserver.unobserve(entry.target);
    }
  });
}, {
  rootMargin: '0px 0px -10% 0px',
  threshold: 0.05
});

/* ===== 铺图墙 ===== */
const colLeft = document.getElementById('colLeft');
const colRight = document.getElementById('colRight');

let expanded = false;

function buildWall() {
  colLeft.innerHTML = '';
  colRight.innerHTML = '';

  const limit = collapseCount();

  allItems.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'wall-item';
    if (i >= limit && !expanded) el.classList.add('hidden');

    el.innerHTML = `
      <div class="wall-frame">
        <img src="${item.src}" alt="" draggable="false">
      </div>
      <div class="wall-name">${item.brand}</div>
      <div class="wall-season">${item.season}</div>
    `;

    el.addEventListener('click', () => {
      openLightbox(allItems, i);
    });

    if (i % 2 === 0) {
      colLeft.appendChild(el);
    } else {
      colRight.appendChild(el);
    }
  });

  document.querySelectorAll('.wall-item:not(.hidden)').forEach(item => {
    revealObserver.observe(item);
  });
}

buildWall();

window.addEventListener('resize', () => {
  if (expanded) return;
  const limit = collapseCount();
  document.querySelectorAll('.wall-item').forEach((el, i) => {
    el.classList.toggle('hidden', i >= limit);
  });
});

/* ===== 展开 ===== */
const expandEntry = document.getElementById('expandEntry');

expandEntry.addEventListener('click', () => {
  expanded = true;
  document.querySelectorAll('.wall-item').forEach(el => {
    el.classList.remove('hidden');
  });
  expandEntry.style.display = 'none';

  document.querySelectorAll('.wall-item').forEach(item => {
    if (!item.classList.contains('revealed')) {
      revealObserver.observe(item);
    }
  });
});

/* ===== 大图预览 ===== */
let currentImages = [];
let currentIndex = 0;

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxMeta = document.getElementById('lightboxMeta');
const captionBox = document.getElementById('captionBox');

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const img = currentImages[currentIndex];
  lightboxImg.src = img.src;
  lightboxMeta.textContent = (currentIndex + 1) + ' / ' + currentImages.length;

  if (img.note) {
    captionBox.innerHTML = `
      <div class="label">Directive</div>
      <div class="note">${img.note}</div>
    `;
  } else {
    captionBox.innerHTML = '';
  }
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateLightbox();
}

function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateLightbox();
}

lightbox.addEventListener('click', (e) => {
  if (e.target.classList.contains('lightbox-img')) return;
  if (e.target.closest('.lightbox-arrow')) return;
  closeLightbox();
});

document.getElementById('prev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevImage();
});

document.getElementById('next').addEventListener('click', (e) => {
  e.stopPropagation();
  nextImage();
});

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'Escape') closeLightbox();
  }
});

let touchStartX = 0;
lightbox.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

lightbox.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx > 0) prevImage();
    else nextImage();
  }
}, { passive: true });
</script>

</body>
</html>
