<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>完整档案 / Archive</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    background: #ffffff; /* 极致纯白 */
    color: #111;
    font-family: "Inter", "Noto Sans SC", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 极窄、炭黑、绝对居中的顶栏 ===== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 36px; 
    background: #111111; /* 炭黑 */
    display: flex;
    align-items: center;
    z-index: 100;
  }

  /* 正中心：绝对居中 */
  .header .center-text {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Helvetica", "Inter", sans-serif; 
    font-size: 11px; 
    font-weight: 500; 
    letter-spacing: 0.25em; /* 拉开字距 */
    color: #eeeeee; 
    text-transform: uppercase;
  }

  /* 左侧：透明的退出入口，鼠标悬浮才显形 */
  .header .hidden-back {
    position: absolute;
    left: 20px;
    font-family: "Helvetica", "Inter", sans-serif;
    font-size: 9px; 
    color: transparent; /* 默认完全透明，看不见 */
    text-decoration: none;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  
  .header .hidden-back:hover {
    color: #666; /* 只有鼠标移到左侧边缘时，才会浮现一点点灰 */
  }

  /* ===== 瀑布流画廊（去除沉重感） ===== */
  .archive-wall {
    column-count: 4; /* 4列瀑布流 */
    column-gap: 32px; /* 巨大的横向留白 */
    max-width: 1600px;
    margin: 0 auto;
    padding: 90px 40px 60px; /* 顶部留出 54px 纯白 + 36px 顶栏 */
  }

  .item {
    break-inside: avoid; /* 防止卡片被截断 */
    page-break-inside: avoid;
    margin-bottom: 48px; /* 巨大的纵向留白 */
    cursor: crosshair; 
  }

  .item img {
    width: 100%;
    height: auto; /* 保留图片原始比例，不再强制裁切 */
    display: block;
    transition: opacity 0.4s ease;
    -webkit-user-drag: none;
  }

  .item:hover img { opacity: 0.85; }

  /* 文字：极小的画廊展签 */
  .item-info {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .item-name { 
    font-size: 10px; 
    font-weight: 500; 
    letter-spacing: 0.1em; 
    text-transform: uppercase; 
    color: #111;
  }
  
  .item-season { 
    font-size: 9px; 
    color: #888; 
    text-transform: uppercase; 
    letter-spacing: 0.05em;
  }

  /* ===== 大图预览 ===== */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10, 10, 10, 0.98);
    display: none; z-index: 999;
    cursor: pointer;
  }
  .lightbox.active { display: block; }
  .lightbox-img {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 85vw; max-height: 80vh;
    object-fit: contain; cursor: default; display: block;
  }
  .lightbox-caption {
    position: absolute; bottom: 4vh; left: 0; right: 0;
    text-align: center; cursor: default; padding: 0 40px;
  }
  .lightbox-caption .label {
    font-family: "Inter", sans-serif; font-weight: 400;
    font-size: 9px; letter-spacing: 0.5em; color: #555;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .lightbox-caption .note {
    font-family: "Noto Sans SC", sans-serif; font-size: 12px;
    letter-spacing: 0.2em; color: #b8b8b8; font-weight: 300;
  }
  .lightbox-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; cursor: pointer; opacity: 0.2; transition: opacity 0.3s;
  }
  .lightbox-arrow:hover { opacity: 0.8; }
  .lightbox-arrow.prev { left: 4vw; }
  .lightbox-arrow.next { right: 4vw; }
  .lightbox-meta {
    position: absolute; top: 40px; left: 6vw; color: #555;
    font-size: 10px; letter-spacing: 0.4em; cursor: default; text-transform: uppercase;
  }

  /* ===== 响应式适配 ===== */
  @media (max-width: 1200px) {
    .archive-wall { column-count: 3; padding: 80px 24px 40px; column-gap: 24px; }
    .item { margin-bottom: 32px; }
  }
  
  @media (max-width: 600px) {
    .header { height: 36px; }
    .header .center-text { font-size: 10px; letter-spacing: 0.2em; }
    .header .hidden-back { left: 16px; }

    .archive-wall { 
      column-count: 2; 
      column-gap: 16px; 
      padding: 60px 12px 30px; 
    }
    
    .item { margin-bottom: 24px; }
    .item-info { flex-direction: column; margin-top: 8px; }
    .item-name { font-size: 9px; }
    .item-season { font-size: 8px; margin-top: 2px; }
    
    .lightbox-img { max-width: 95vw; max-height: 75vh; }
    .lightbox-arrow.prev { left: 10px; }
    .lightbox-arrow.next { right: 10px; }
  }
</style>
</head>
<body>

  <!-- 极窄居中顶栏 -->
  <div class="header" id="mainHeader">
    <a href="index.html" class="hidden-back">Exit</a>
    <div class="center-text">0.07%</div>
  </div>

  <!-- 图墙 -->
  <div class="archive-wall" id="archiveWall"></div>

  <!-- 大图预览 -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-meta" id="lightboxMeta"></div>
    <div class="lightbox-arrow prev" id="prev">‹</div>
    <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
    <div class="lightbox-arrow next" id="next">›</div>
    <div class="lightbox-caption" id="captionBox"></div>
  </div>

<script>
/* ===== 变音符号降级 ===== */
const LIGATURE_MAP = { 'Æ': 'AE', 'Œ': 'OE', 'Ø': 'O', 'ß': 'SS', 'Đ': 'D', 'Ł': 'L', 'Þ': 'TH', 'Ð': 'D', 'Ħ': 'H' };
function toBase(str) {
  let s = (str || '').toString();
  s = s.replace(/[ÆŒØßĐŁÞÐĦæœøßđłþðħ]/g, ch => LIGATURE_MAP[ch.toUpperCase()] || ch);
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.toUpperCase();
}
function getSearchKey(name) { return toBase(name); }

/* ===== 数据填入 ===== */
const brandsData = [
  { folder: 'avavav', name: 'AVAVAV', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'bed-j-w-ford', name: 'BED J.W. FORD', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'botter', name: 'BOTTER', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'burc-akyol', name: 'BURC AKYOL', images: [{ file: '01.webp', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点' }] },
  { folder: 'charles-jeffrey-loverboy', name: 'CHARLES JEFFREY LOVERBOY', images: [
    { file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 MENSWEAR', note: '' }
  ]},
  { folder: 'danielle-frankel', name: 'DANIELLE FRANKEL', images: [{ file: '01.webp', season: 'FALL 2025 READY-TO-WEAR', note: '' }] },
  { folder: 'dries-van-noten', name: 'DRIES VAN NOTEN', images: [{ file: '01.webp', season: 'FALL 2021 MENSWEAR', note: '' }] },
  { folder: 'eenk', name: 'EENK', images: [{ file: '01.webp', season: 'SPRING 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'feng-chen-wang', name: 'FENG CHEN WANG', images: [{ file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' }] },
  { folder: 'freya-dalsjo', name: 'FREYA DALSJØ', images: [
    { file: '01.webp', season: 'COPENHAGEN SPRING 2026', note: '' },
    { file: '02.webp', season: 'COPENHAGEN FALL 2026', note: '' }
  ]},
  { folder: 'harris-reed', name: 'HARRIS REED', images: [{ file: '01.webp', season: 'FALL 2022 READY-TO-WEAR', note: '头顶上的改掉' }] },
  { folder: 'loewe', name: 'LOEWE', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '仅上衣' }] },
  { folder: 'maison-mihara-yasuhiro', name: 'MAISON MIHARA YASUHIRO', images: [{ file: '01.webp', season: 'SPRING 2027 MENSWEAR', note: '去掉项链' }] },
  { folder: 'matieres-fecales', name: 'MATIÈRES FÉCALES', images: [{ file: '01.webp', season: 'SPRING 2027 READY-TO-WEAR', note: '' }] },
  { folder: 'palomo-spain', name: 'PALOMO SPAIN', images: [
    { file: '01.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '03.webp', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
  ]},
  { folder: 'robert-wun', name: 'ROBERT WUN', images: [
    { file: '01.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '02.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '03.webp', season: 'FALL 2024 COUTURE', note: '' },
    { file: '04.webp', season: 'SPRING 2024 COUTURE', note: '' }
  ]},
  { folder: 'saint-laurent', name: 'SAINT LAURENT', images: [{ file: '01.webp', season: 'SPRING 2018 READY-TO-WEAR', note: '' }] },
  { folder: 'versace', name: 'VERSACE', images: [
    { file: '01.webp', season: 'SPRING 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' },
    { file: '03.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' }
  ]},
  { folder: 'wooyoungmi', name: 'WOOYOUNGMI', images: [
    { file: '01.webp', season: 'FALL 2018 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2018 MENSWEAR', note: '内搭换掉' }
  ]}
];

brandsData.sort((a, b) => getSearchKey(a.name).localeCompare(getSearchKey(b.name), 'en'));
const allItems = [];
brandsData.forEach(brand => {
  brand.images.forEach(img => {
    allItems.push({
      src: `images/${brand.folder}/${img.file}`,
      brand: brand.name,
      season: img.season,
      note: img.note
    });
  });
});

/* ===== 生成图墙 ===== */
const archiveWall = document.getElementById('archiveWall');
allItems.forEach((item, index) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <img src="${item.src}" alt="" draggable="false" loading="lazy">
    <div class="item-info">
      <div class="item-name">${item.brand}</div>
      <div class="item-season">${item.season}</div>
    </div>
  `;
  
  el.addEventListener('click', () => {
    openLightbox(allItems, index);
  });
  
  archiveWall.appendChild(el);
});

/* ===== 大图预览逻辑 ===== */
let currentImages = [];
let currentIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxMeta = document.getElementById('lightboxMeta');
const captionBox = document.getElementById('captionBox');

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const img = currentImages[currentIndex];
  lightboxImg.src = img.src;
  lightboxMeta.textContent = (currentIndex + 1) + ' / ' + currentImages.length;

  if (img.note) {
    captionBox.innerHTML = `
      <div class="label">Directive</div>
      <div class="note">${img.note}</div>
    `;
  } else {
    captionBox.innerHTML = '';
  }
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateLightbox();
}
function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateLightbox();
}

lightbox.addEventListener('click', (e) => {
  if (e.target.classList.contains('lightbox-img')) return;
  if (e.target.closest('.lightbox-arrow')) return;
  closeLightbox();
});

document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'Escape') closeLightbox();
  }
});

let touchStartX = 0;
lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
lightbox.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx > 0) prevImage(); else nextImage();
  }
}, { passive: true });
</script>

</body>
</html>
