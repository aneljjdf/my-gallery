<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>完整档案 / Full Archive</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #fafaf8; /* 底色 */
    color: #111;
    font-family: "Inter", "Noto Sans SC", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 悬浮导航 ===== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 30px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    pointer-events: none;
    mix-blend-mode: difference; 
    transition: color 0.3s ease; 
  }

  .header .logo, .header .back {
    pointer-events: auto;
    font-family: "EB Garamond", serif;
    font-size: 11px;
    color: #fff; 
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.3s;
  }
  .header .back:hover, .header .logo:hover { color: #aaa; }

  /* ===== 核心改造：图墙 ===== */
  .archive-wall {
    display: grid;
    /* 电脑端排 4 列（因为加了间距，5 列可能会太挤） */
    grid-template-columns: repeat(4, 1fr); 
    /* 拉大间距，让色彩有呼吸的空间 */
    gap: 24px; 
    background: #fafaf8; 
    padding: 100px 40px 40px; /* 顶部留出导航栏的空间 */
  }

  .item {
    background: #ffffff; /* 给每个标本一个白底相框 */
    position: relative;
    cursor: crosshair; 
    overflow: hidden;
    -webkit-touch-callout: none; 
    -webkit-user-select: none; 
    user-select: none;
    /* 可选的：加一圈极淡的线框，像档案盒的边缘 */
    border: 1px solid #eaeaea; 
    /* 加入内边距，让图片不要填满相框，四周留白 */
    padding: 12px; 
  }

  .item img {
    width: 100%;
    height: 100%;
    /* 统一相框内的图片比例，形成严密的网格 */
    aspect-ratio: 3 / 4; 
    object-fit: cover; 
    display: block;
    transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    -webkit-user-drag: none; 
    pointer-events: auto;
  }

  /* 电脑端 Hover */
  .item-info {
    /* 标签也向内收缩，贴在内边距上 */
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    background: rgba(255, 255, 255, 0.95);
    padding: 10px 12px;
    opacity: 0;
    transform: translateY(100%);
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .item:hover img { transform: scale(1.03); }
  .item:hover .item-info { opacity: 1; transform: translateY(0); }

  .item-name { font-size: 10px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: #111;}
  .item-season { font-size: 9px; color: #888; margin-top: 2px; text-transform: uppercase; }

  /* ===== 大图预览 ===== */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10, 10, 10, 0.98);
    display: none; z-index: 999;
    cursor: pointer;
  }
  .lightbox.active { display: block; }
  .lightbox-img {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 85vw; max-height: 80vh;
    object-fit: contain; cursor: default; display: block;
  }
  .lightbox-caption {
    position: absolute; bottom: 4vh; left: 0; right: 0;
    text-align: center; cursor: default; padding: 0 40px;
  }
  .lightbox-caption .label {
    font-family: "Inter", sans-serif; font-weight: 400;
    font-size: 9px; letter-spacing: 0.5em; color: #555;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .lightbox-caption .note {
    font-family: "Noto Sans SC", sans-serif; font-size: 12px;
    letter-spacing: 0.2em; color: #b8b8b8; font-weight: 300;
  }
  .lightbox-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; cursor: pointer; opacity: 0.2; transition: opacity 0.3s;
  }
  .lightbox-arrow:hover { opacity: 0.8; }
  .lightbox-arrow.prev { left: 4vw; }
  .lightbox-arrow.next { right: 4vw; }
  .lightbox-meta {
    position: absolute; top: 40px; left: 6vw; color: #555;
    font-size: 10px; letter-spacing: 0.4em; cursor: default; text-transform: uppercase;
  }

  /* ===== 平板端 ===== */
  @media (max-width: 1024px) { 
    .archive-wall { grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 80px 20px 20px; } 
  }
  
  /* ===== 手机端：去掉白框，恢复两列紧凑，但保留微小的间距 ===== */
  @media (max-width: 600px) {
    /* 手机屏幕小，如果再加白框会显得太小，所以手机端去掉白框和 border */
    .archive-wall { grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 60px 4px 4px; }
    
    .header { 
      mix-blend-mode: normal; 
      padding: 16px 20px; 
      background: transparent; 
      color: #111; 
    }
    .header .logo, .header .back { color: inherit; font-size: 11px; font-weight: 500; }

    .item {
      padding: 0;
      border: none;
      background: #fafaf8;
    }

    .item img { aspect-ratio: auto; height: auto; } 
    
    .item-info { display: none; }
    
    /* 手机端点击弹出的标签，重新贴底 */
    .item.is-active .item-info {
      display: block;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 10px;
      opacity: 1; transform: translateY(0);
    }

    .lightbox-img { max-width: 95vw; max-height: 75vh; }
    .lightbox-arrow.prev { left: 10px; }
    .lightbox-arrow.next { right: 10px; }
  }
</style>
</head>
<body>

  <div class="header" id="mainHeader">
    <div class="logo">确认档案 / Archive</div>
    <a href="index.html" class="back">← 返回</a>
  </div>

  <div class="archive-wall" id="archiveWall"></div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-meta" id="lightboxMeta"></div>
    <div class="lightbox-arrow prev" id="prev">‹</div>
    <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
    <div class="lightbox-arrow next" id="next">›</div>
    <div class="lightbox-caption" id="captionBox"></div>
  </div>

<script>
/* ===== 数据部分保持不变 ===== */
const LIGATURE_MAP = { 'Æ': 'AE', 'Œ': 'OE', 'Ø': 'O', 'ß': 'SS', 'Đ': 'D', 'Ł': 'L', 'Þ': 'TH', 'Ð': 'D', 'Ħ': 'H' };
function toBase(str) {
  let s = (str || '').toString();
  s = s.replace(/[ÆŒØßĐŁÞÐĦæœøßđłþðħ]/g, ch => LIGATURE_MAP[ch.toUpperCase()] || ch);
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.toUpperCase();
}
function getSearchKey(name) { return toBase(name); }

const brandsData = [
  { folder: 'avavav', name: 'AVAVAV', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'bed-j-w-ford', name: 'BED J.W. FORD', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'botter', name: 'BOTTER', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'burc-akyol', name: 'BURC AKYOL', images: [{ file: '01.webp', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点' }] },
  { folder: 'charles-jeffrey-loverboy', name: 'CHARLES JEFFREY LOVERBOY', images: [
    { file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 MENSWEAR', note: '' }
  ]},
  { folder: 'danielle-frankel', name: 'DANIELLE FRANKEL', images: [{ file: '01.webp', season: 'FALL 2025 READY-TO-WEAR', note: '' }] },
  { folder: 'dries-van-noten', name: 'DRIES VAN NOTEN', images: [{ file: '01.webp', season: 'FALL 2021 MENSWEAR', note: '' }] },
  { folder: 'eenk', name: 'EENK', images: [{ file: '01.webp', season: 'SPRING 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'feng-chen-wang', name: 'FENG CHEN WANG', images: [{ file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' }] },
  { folder: 'freya-dalsjo', name: 'FREYA DALSJØ', images: [
    { file: '01.webp', season: 'COPENHAGEN SPRING 2026', note: '' },
    { file: '02.webp', season: 'COPENHAGEN FALL 2026', note: '' }
  ]},
  { folder: 'harris-reed', name: 'HARRIS REED', images: [{ file: '01.webp', season: 'FALL 2022 READY-TO-WEAR', note: '头顶上的改掉' }] },
  { folder: 'loewe', name: 'LOEWE', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '仅上衣' }] },
  { folder: 'maison-mihara-yasuhiro', name: 'MAISON MIHARA YASUHIRO', images: [{ file: '01.webp', season: 'SPRING 2027 MENSWEAR', note: '去掉项链' }] },
  { folder: 'matieres-fecales', name: 'MATIÈRES FÉCALES', images: [{ file: '01.webp', season: 'SPRING 2027 READY-TO-WEAR', note: '' }] },
  { folder: 'palomo-spain', name: 'PALOMO SPAIN', images: [
    { file: '01.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '03.webp', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
  ]},
  { folder: 'robert-wun', name: 'ROBERT WUN', images: [
    { file: '01.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '02.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '03.webp', season: 'FALL 2024 COUTURE', note: '' },
    { file: '04.webp', season: 'SPRING 2024 COUTURE', note: '' }
  ]},
  { folder: 'saint-laurent', name: 'SAINT LAURENT', images: [{ file: '01.webp', season: 'SPRING 2018 READY-TO-WEAR', note: '' }] },
  { folder: 'versace', name: 'VERSACE', images: [
    { file: '01.webp', season: 'SPRING 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' },
    { file: '03.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' }
  ]},
  { folder: 'wooyoungmi', name: 'WOOYOUNGMI', images: [
    { file: '01.webp', season: 'FALL 2018 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2018 MENSWEAR', note: '内搭换掉' }
  ]}
];

brandsData.sort((a, b) => getSearchKey(a.name).localeCompare(getSearchKey(b.name), 'en'));
const allItems = [];
brandsData.forEach(brand => {
  brand.images.forEach(img => {
    allItems.push({
      src: `images/${brand.folder}/${img.file}`,
      brand: brand.name,
      season: img.season,
      note: img.note
    });
  });
});

const archiveWall = document.getElementById('archiveWall');
allItems.forEach((item, index) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <img src="${item.src}" alt="" draggable="false" loading="lazy">
    <div class="item-info">
      <div class="item-name">${item.brand}</div>
      <div class="item-season">${item.season}</div>
    </div>
  `;
  
  el.addEventListener('click', (e) => {
    if (window.innerWidth <= 600) {
      const currentActive = document.querySelector('.item.is-active');
      if (currentActive && currentActive !== el) currentActive.classList.remove('is-active');
      el.classList.toggle('is-active');
      if (el.classList.contains('is-active')) e.stopPropagation();
      else openLightbox(allItems, index);
    } else {
      openLightbox(allItems, index);
    }
  });
  archiveWall.appendChild(el);
});

document.addEventListener('click', (e) => {
  if (window.innerWidth <= 600 && !e.target.closest('.item')) {
    document.querySelectorAll('.item.is-active').forEach(item => item.classList.remove('is-active'));
  }
});

/* ===== 动态亮度反色 ===== */
const mainHeader = document.getElementById('mainHeader');
function updateHeaderColor() {
  if (window.innerWidth > 600) {
    mainHeader.style.color = '';
    mainHeader.style.textShadow = '';
    return;
  }
  const items = document.querySelectorAll('.item');
  let activeItem = null;
  const headerHeight = 60;
  for (let i = 0; i < items.length; i++) {
    const rect = items[i].getBoundingClientRect();
    if (rect.top <= headerHeight && rect.bottom >= 0) {
      activeItem = items[i];
      break;
    }
  }
  if (activeItem) {
    const img = activeItem.querySelector('img');
    if (img && img.complete && img.naturalWidth > 0) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 10; canvas.height = 10;
      try {
        ctx.drawImage(img, 0, 0, 10, 10, 0, 0, 10, 10);
        const data = ctx.getImageData(0, 0, 10, 10).data;
        let colorSum = 0;
        for (let i = 0; i < data.length; i += 4) {
          colorSum += (data[i] + data[i+1] + data[i+2]) / 3;
        }
        const avgBrightness = colorSum / (data.length / 4);
        if (avgBrightness > 120) {
          mainHeader.style.color = '#111';
          mainHeader.style.textShadow = '0 1px 2px rgba(255,255,255,0.3)';
        } else {
          mainHeader.style.color = '#fff';
          mainHeader.style.textShadow = '0 1px 3px rgba(0,0,0,0.5)';
        }
      } catch (e) { mainHeader.style.color = '#111'; }
    }
  }
}

let isScrolling;
window.addEventListener('scroll', () => {
  window.clearTimeout(isScrolling);
  isScrolling = setTimeout(updateHeaderColor, 30);
}, { passive: true });
window.addEventListener('resize', updateHeaderColor);
setTimeout(updateHeaderColor, 1000);

/* ===== 大图预览 ===== */
let currentImages = [];
let currentIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxMeta = document.getElementById('lightboxMeta');
const captionBox = document.getElementById('captionBox');

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const img = currentImages[currentIndex];
  lightboxImg.src = img.src;
  lightboxMeta.textContent = (currentIndex + 1) + ' / ' + currentImages.length;
  if (img.note) {
    captionBox.innerHTML = `<div class="label">Directive</div><div class="note">${img.note}</div>`;
  } else {
    captionBox.innerHTML = '';
  }
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateLightbox();
}
function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateLightbox();
}

lightbox.addEventListener('click', (e) => {
  if (e.target.classList.contains('lightbox-img')) return;
  if (e.target.closest('.lightbox-arrow')) return;
  closeLightbox();
});

document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'Escape') closeLightbox();
  }
});

let touchStartX = 0;
lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
lightbox.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { if (dx > 0) prevImage(); else nextImage(); }
}, { passive: true });
</script>

</body>
</html>
