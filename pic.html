<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collage 拼贴</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  background: #eef1f5;
  color: #4a5560;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* 背景：二进制数字流 */
.binary-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  font-family: monospace;
  font-size: 11px;
  line-height: 16px;
  letter-spacing: 2px;
  color: rgba(120, 140, 160, 0.18);
  padding: 10px;
  overflow: hidden;
  word-break: break-all;
  pointer-events: none;
}

/* 拼贴容器 */
.collage {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 60px 20px 100px;
  min-height: 100vh;
}

/* 图片框 */
.img-frame {
  position: absolute;
  overflow: hidden;
  filter: saturate(0.4) brightness(1.05) contrast(0.95);
  opacity: 0.85;
  box-shadow: 0 2px 8px rgba(100, 120, 140, 0.12),
              inset 0 0 0 1px rgba(255, 255, 255, 0.6);
}

.img-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 图片位置 */
.img-1 { top: 40px; left: 30px; width: 180px; height: 240px; transform: rotate(-3deg); }
.img-2 { top: 100px; right: 40px; width: 200px; height: 280px; transform: rotate(2deg); }
.img-3 { top: 360px; left: 60px; width: 220px; height: 300px; transform: rotate(1.5deg); }
.img-4 { top: 420px; right: 60px; width: 160px; height: 220px; transform: rotate(-2deg); }
.img-5 { top: 720px; left: 120px; width: 240px; height: 320px; transform: rotate(-1deg); }
.img-6 { top: 800px; right: 80px; width: 180px; height: 240px; transform: rotate(3deg); }

/* 文字卡片 */
.text-card {
  position: absolute;
  background: rgba(255, 255, 255, 0.7);
  padding: 12px 18px;
  font-size: 13px;
  letter-spacing: 0.15em;
  color: #5a6570;
  box-shadow: 0 1px 3px rgba(100, 120, 140, 0.1);
  backdrop-filter: blur(2px);
  z-index: 2;
}

.text-1 { top: 60px; left: 240px; transform: rotate(2deg); }
.text-2 { top: 200px; right: 260px; transform: rotate(-2deg); font-size: 20px; letter-spacing: 0.3em; color: #8a95a0; background: transparent; box-shadow: none; }
.text-3 { top: 400px; left: 320px; font-size: 15px; letter-spacing: 0.2em; }
.text-4 { top: 580px; right: 280px; transform: rotate(1deg); font-size: 22px; letter-spacing: 0.4em; color: #b0b8c0; background: transparent; box-shadow: none; }
.text-5 { top: 760px; left: 380px; transform: rotate(-1deg); font-size: 14px; }

/* 发光爱心 / 星星 */
.shape {
  position: absolute;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #d0d8e0;
  background: rgba(255, 255, 255, 0.65);
  border-radius: 50%;
  width: 56px;
  height: 56px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 16px rgba(180, 200, 230, 0.5),
              inset 0 0 8px rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(2px);
}

.shape-1 { top: 150px; left: 420px; transform: rotate(-8deg); }
.shape-2 { top: 500px; right: 200px; transform: rotate(12deg); }
.shape-3 { top: 900px; left: 200px; transform: rotate(-5deg); }

/* 散落字母 */
.letter {
  position: absolute;
  font-family: Georgia, serif;
  font-size: 40px;
  color: rgba(140, 160, 180, 0.35);
  z-index: 2;
  letter-spacing: 0.05em;
}

.letter-1 { top: 120px; left: 80px; }
.letter-2 { top: 250px; left: 500px; font-size: 60px; }
.letter-3 { top: 520px; left: 160px; font-size: 50px; }
.letter-4 { top: 680px; right: 220px; }
.letter-5 { top: 950px; right: 120px; font-size: 55px; }

/* 竖排日文 */
.vertical-text {
  position: absolute;
  writing-mode: vertical-rl;
  font-size: 14px;
  letter-spacing: 0.4em;
  color: #7a8590;
  z-index: 2;
}

.v-1 { top: 200px; left: 460px; }
.v-2 { top: 480px; right: 340px; }
.v-3 { top: 800px; left: 460px; }

/* 细线框 */
.line-frame {
  position: absolute;
  border: 1px solid rgba(160, 180, 200, 0.4);
  z-index: 2;
}

.line-1 { top: 340px; right: 300px; width: 80px; height: 60px; transform: rotate(-3deg); }
.line-2 { top: 640px; left: 80px; width: 100px; height: 80px; transform: rotate(4deg); }

/* 手机适配 */
@media (max-width: 768px) {
  .collage { padding: 40px 12px 80px; }

  .img-frame {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;
    width: 80% !important;
    height: auto !important;
    aspect-ratio: 3 / 4;
    margin: 20px auto;
    transform: rotate(0) !important;
  }

  .text-card, .shape, .letter, .vertical-text, .line-frame {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;
    margin: 12px auto;
    transform: rotate(0) !important;
  }

  .vertical-text {
    writing-mode: horizontal-tb;
  }
}
</style>
</head>
<body>

<div class="binary-bg" id="binaryBg"></div>

<div class="collage">

  <!-- 图片位置：把你自己的图填进 src -->
  <div class="img-frame img-1">< img src="" alt=""></div>
  <div class="img-frame img-2">< img src="" alt=""></div>
  <div class="img-frame img-3">< img src="" alt=""></div>
  <div class="img-frame img-4">< img src="" alt=""></div>
  <div class="img-frame img-5">< img src="" alt=""></div>
  <div class="img-frame img-6">< img src="" alt=""></div>

  <!-- 文字卡片 -->
  <div class="text-card text-1">Search of Miss Ru</div>
  <div class="text-card text-2">sweety</div>
  <div class="text-card text-3">What's Cyber?</div>
  <div class="text-card text-4">VIRTUAL</div>
  <div class="text-card text-5">I'm not a robot</div>

  <!-- 发光爱心 / 星星 -->
  <div class="shape shape-1">♡</div>
  <div class="shape shape-2">★</div>
  <div class="shape shape-3">✧</div>

  <!-- 散落字母 -->
  <div class="letter letter-1">Q</div>
  <div class="letter letter-2">W</div>
  <div class="letter letter-3">E</div>
  <div class="letter letter-4">R</div>
  <div class="letter letter-5">T</div>

  <!-- 竖排日文 -->
  <div class="vertical-text v-1">いけないこと</div>
  <div class="vertical-text v-2">愛がない</div>
  <div class="vertical-text v-3">と会見</div>

  <!-- 细线框 -->
  <div class="line-frame line-1"></div>
  <div class="line-frame line-2"></div>

</div>

<script>
  const bg = document.getElementById('binaryBg');
  let str = '';
  for (let i = 0; i < 600; i++) {
    str += Math.random() > 0.5 ? '1' : '0';
  }
  bg.textContent = str.repeat(8);
</script>

</body>
</html>
