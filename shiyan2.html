<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>为这个领域，划一条金线。</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: "Inter", "Noto Sans SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #fafaf8; /* 冷灰/米白档案底色 */
  color: #1a1a1a;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  font-weight: 400;
}

img {
  -webkit-user-drag: none;
  pointer-events: auto;
}

.page {
  padding: 0 8vw 160px;
}

@media (max-width: 600px) {
  .page { padding: 0 5% 100px; }
}

/* ===== 第一屏：宣告 ===== */
.opening {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.opening .line-main {
  font-family: "EB Garamond", "Noto Sans SC", Georgia, serif;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: #1a1a1a;
  line-height: 1.8;
}

.opening .line-sub {
  margin-top: 32px;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.3em;
  color: #888;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  .opening { min-height: 75vh; }
  .opening .line-main { font-size: 22px; letter-spacing: 0.1em; }
}

/* ===== 第二屏：数据 ===== */
.stats-container {
  text-align: center;
  padding-bottom: 12vh;
  display: flex;
  justify-content: center;
  gap: 80px;
  border-bottom: 1px solid #e5e5e5;
  margin-bottom: 12vh;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-number {
  font-family: "EB Garamond", serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: #1a1a1a;
}

.stat-label {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #888;
}

@media (max-width: 600px) {
  .stats-container { flex-direction: column; gap: 36px; margin-bottom: 10vh; padding-bottom: 8vh; }
}

/* ===== 图墙：无缝双列拼图 ===== */
.wall {
  max-width: 1600px;
  margin: 0 auto;
}

.wall-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: start;
  column-gap: 4vw; /* 两列之间的间距稍微缩小 */
}

.wall-col {
  display: flex;
  flex-direction: column;
  gap: 4vw; /* 图片之间的纵向间距 */
}

.wall-item {
  width: 100%;
  cursor: pointer;
  opacity: 0.01;
  transform: translateY(20px);
  transition: opacity 1s cubic-bezier(.19,1,.22,1), transform 1s cubic-bezier(.19,1,.22,1);
  will-change: opacity, transform;
}

.wall-item.revealed {
  opacity: 1;
  transform: translateY(0);
}

.wall-item .wall-frame {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #eaeaea;
}

.wall-item .wall-frame img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
  transition: transform 1.5s cubic-bezier(.19,1,.22,1), opacity 0.6s ease;
}

.wall-item:hover .wall-frame img {
  opacity: 0.9;
  transform: scale(1.03);
}

/* 标签：极简、微小 */
.wall-item .wall-name {
  margin-top: 12px;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.15em;
  color: #1a1a1a;
  text-transform: uppercase;
}

.wall-item .wall-season {
  margin-top: 4px;
  font-size: 9px;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: #888;
}

.wall-item.hidden {
  display: none;
}

@media (max-width: 600px) {
  .wall-grid { display: block; }
  .wall-col { display: contents; }
  .wall-item { width: 100%; margin: 0 0 8vw 0 !important; padding: 0; }
}

/* ===== 操作区：展开与跳转 ===== */
.action-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  margin-top: 16vh;
}

.action-btn {
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.4em;
  color: #666;
  text-transform: uppercase;
  transition: color 0.3s ease;
  padding: 10px 20px;
}

.action-btn:hover {
  color: #1a1a1a;
}

.action-link {
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: #999;
  border-bottom: 1px solid #ddd;
  padding-bottom: 4px;
  transition: color 0.3s, border-color 0.3s;
}

.action-link:hover {
  color: #1a1a1a;
  border-color: #1a1a1a;
}

/* ===== 页脚 ===== */
.footer {
  margin-top: 18vh;
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: #bbb;
  line-height: 2.4;
  text-transform: uppercase;
  font-weight: 300;
}

/* ===== 大图预览 ===== */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.98);
  display: none;
  z-index: 999;
  cursor: pointer;
}

.lightbox.active {
  display: block;
}

.lightbox-img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 85vw;
  max-height: 80vh;
  object-fit: contain;
  cursor: default;
  display: block;
}

.lightbox-caption {
  position: absolute;
  bottom: 4vh;
  left: 0;
  right: 0;
  text-align: center;
  cursor: default;
  padding: 0 40px;
}

.lightbox-caption .label {
  font-family: "Inter", sans-serif;
  font-style: normal;
  font-weight: 400;
  font-size: 9px;
  letter-spacing: 0.5em;
  color: #555;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.lightbox-caption .note {
  font-family: "Noto Sans SC", sans-serif;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: #b8b8b8;
  font-weight: 300;
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  opacity: 0.2;
  transition: opacity 0.3s;
  font-weight: 200;
}

.lightbox-arrow:hover { opacity: 0.8; }
.lightbox-arrow.prev { left: 4vw; }
.lightbox-arrow.next { right: 4vw; }

.lightbox-meta {
  position: absolute;
  top: 40px;
  left: 6vw;
  color: #555;
  font-size: 10px;
  letter-spacing: 0.4em;
  cursor: default;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  .lightbox-img { max-width: 95vw; max-height: 75vh; }
  .lightbox-arrow.prev { left: 10px; }
  .lightbox-arrow.next { right: 10px; }
  .lightbox-meta { left: 5vw; }
}
</style>
</head>
<body>

<div class="page">

  <!-- 第一屏 -->
  <div class="opening">
    <div class="line-main">为这个领域，划一条金线。</div>
    <div class="line-sub">显影室 / 0.07%</div>
  </div>

  <!-- 第二屏 -->
  <div class="stats-container">
    <div class="stat-item">
      <div class="stat-number">60万+</div>
      <div class="stat-label">阅过造型</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">500</div>
      <div class="stat-label">金线之上</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">0.07%</div>
      <div class="stat-label">成立率</div>
    </div>
  </div>

  <!-- 第三屏 -->
  <div class="wall">
    <div class="wall-grid">
      <div class="wall-col col-left" id="colLeft"></div>
      <div class="wall-col col-right" id="colRight"></div>
    </div>
  </div>

  <!-- 操作区 -->
  <div class="action-area">
    <div class="action-btn" id="toggleBtn">展开 / Expand</div>
    <!-- 如果以后有完整的500套图独立页面，把 href="#" 换成那个页面的链接即可 -->
    <a href="#" class="action-link">查看完整档案 / Full Archive</a>
  </div>

  <!-- 页脚 -->
  <div class="footer">
    Archive judgments by [X].<br>
    All runway images © their respective owners.
  </div>

</div>

<!-- 大图预览 -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-meta" id="lightboxMeta"></div>
  <div class="lightbox-arrow prev" id="prev">‹</div>
  <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
  <div class="lightbox-arrow next" id="next">›</div>
  <div class="lightbox-caption" id="captionBox"></div>
</div>

<script>
const LIGATURE_MAP = {
  'Æ': 'AE', 'Œ': 'OE', 'Ø': 'O', 'ß': 'SS',
  'Đ': 'D', 'Ł': 'L', 'Þ': 'TH', 'Ð': 'D', 'Ħ': 'H'
};

function toBase(str) {
  let s = (str || '').toString();
  s = s.replace(/[ÆŒØßĐŁÞÐĦæœøßđłþðħ]/g, ch => LIGATURE_MAP[ch.toUpperCase()] || ch);
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.toUpperCase();
}

function getSearchKey(name) {
  return toBase(name);
}

const brandsData = [
  { folder: 'avavav', name: 'AVAVAV', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'bed-j-w-ford', name: 'BED J.W. FORD', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'botter', name: 'BOTTER', images: [{ file: '01.webp', season: 'FALL 2024 MENSWEAR', note: '' }] },
  { folder: 'burc-akyol', name: 'BURC AKYOL', images: [{ file: '01.webp', season: 'SPRING 2026 READY-TO-WEAR', note: '肩宽缩小点' }] },
  { folder: 'charles-jeffrey-loverboy', name: 'CHARLES JEFFREY LOVERBOY', images: [
    { file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 MENSWEAR', note: '' }
  ]},
  { folder: 'danielle-frankel', name: 'DANIELLE FRANKEL', images: [{ file: '01.webp', season: 'FALL 2025 READY-TO-WEAR', note: '' }] },
  { folder: 'dries-van-noten', name: 'DRIES VAN NOTEN', images: [{ file: '01.webp', season: 'FALL 2021 MENSWEAR', note: '' }] },
  { folder: 'eenk', name: 'EENK', images: [{ file: '01.webp', season: 'SPRING 2024 READY-TO-WEAR', note: '' }] },
  { folder: 'feng-chen-wang', name: 'FENG CHEN WANG', images: [{ file: '01.webp', season: 'SPRING 2025 MENSWEAR', note: '' }] },
  { folder: 'freya-dalsjo', name: 'FREYA DALSJØ', images: [
    { file: '01.webp', season: 'COPENHAGEN SPRING 2026', note: '' },
    { file: '02.webp', season: 'COPENHAGEN FALL 2026', note: '' }
  ]},
  { folder: 'harris-reed', name: 'HARRIS REED', images: [{ file: '01.webp', season: 'FALL 2022 READY-TO-WEAR', note: '头顶上的改掉' }] },
  { folder: 'loewe', name: 'LOEWE', images: [{ file: '01.webp', season: 'FALL 2024 READY-TO-WEAR', note: '仅上衣' }] },
  { folder: 'maison-mihara-yasuhiro', name: 'MAISON MIHARA YASUHIRO', images: [{ file: '01.webp', season: 'SPRING 2027 MENSWEAR', note: '去掉项链' }] },
  { folder: 'matieres-fecales', name: 'MATIÈRES FÉCALES', images: [{ file: '01.webp', season: 'SPRING 2027 READY-TO-WEAR', note: '' }] },
  { folder: 'palomo-spain', name: 'PALOMO SPAIN', images: [
    { file: '01.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'FALL 2023 READY-TO-WEAR', note: '' },
    { file: '03.webp', season: 'FALL 2023 READY-TO-WEAR', note: '下半身' }
  ]},
  { folder: 'robert-wun', name: 'ROBERT WUN', images: [
    { file: '01.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '02.webp', season: 'SPRING 2026 COUTURE', note: '' },
    { file: '03.webp', season: 'FALL 2024 COUTURE', note: '' },
    { file: '04.webp', season: 'SPRING 2024 COUTURE', note: '' }
  ]},
  { folder: 'saint-laurent', name: 'SAINT LAURENT', images: [{ file: '01.webp', season: 'SPRING 2018 READY-TO-WEAR', note: '' }] },
  { folder: 'versace', name: 'VERSACE', images: [
    { file: '01.webp', season: 'SPRING 2023 READY-TO-WEAR', note: '' },
    { file: '02.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' },
    { file: '03.webp', season: 'PRE-FALL 2024 MENSWEAR', note: '' }
  ]},
  { folder: 'wooyoungmi', name: 'WOOYOUNGMI', images: [
    { file: '01.webp', season: 'FALL 2018 MENSWEAR', note: '' },
    { file: '02.webp', season: 'FALL 2018 MENSWEAR', note: '内搭换掉' }
  ]}
];

brandsData.sort((a, b) =>
  getSearchKey(a.name).localeCompare(getSearchKey(b.name), 'en')
);

const allItems = [];
brandsData.forEach(brand => {
  brand.images.forEach(img => {
    allItems.push({
      src: `images/${brand.folder}/${img.file}`,
      brand: brand.name,
      season: img.season,
      note: img.note
    });
  });
});

function collapseCount() {
  return window.matchMedia('(max-width: 600px)').matches ? 8 : 12;
}

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('revealed');
      revealObserver.unobserve(entry.target);
    }
  });
}, {
  rootMargin: '0px 0px -5% 0px',
  threshold: 0.05
});

const colLeft = document.getElementById('colLeft');
const colRight = document.getElementById('colRight');
const toggleBtn = document.getElementById('toggleBtn');

let expanded = false;

function buildWall() {
  colLeft.innerHTML = '';
  colRight.innerHTML = '';

  const limit = collapseCount();

  allItems.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'wall-item';
    if (i >= limit && !expanded) el.classList.add('hidden');

    el.innerHTML = `
      <div class="wall-frame">
        <img src="${item.src}" alt="" draggable="false" loading="lazy">
      </div>
      <div class="wall-name">${item.brand}</div>
      <div class="wall-season">${item.season}</div>
    `;

    el.addEventListener('click', () => {
      openLightbox(allItems, i);
    });

    if (i % 2 === 0) {
      colLeft.appendChild(el);
    } else {
      colRight.appendChild(el);
    }
  });

  document.querySelectorAll('.wall-item:not(.hidden)').forEach(item => {
    revealObserver.observe(item);
  });
}

buildWall();

window.addEventListener('resize', () => {
  if (expanded) return;
  const limit = collapseCount();
  document.querySelectorAll('.wall-item').forEach((el, i) => {
    el.classList.toggle('hidden', i >= limit);
  });
});

/* ===== 展开/收起逻辑 ===== */
toggleBtn.addEventListener('click', () => {
  expanded = !expanded;
  
  if (expanded) {
    document.querySelectorAll('.wall-item').forEach(el => el.classList.remove('hidden'));
    toggleBtn.textContent = '收起 / Collapse';
    
    document.querySelectorAll('.wall-item').forEach(item => {
      if (!item.classList.contains('revealed')) {
        revealObserver.observe(item);
      }
    });
  } else {
    const limit = collapseCount();
    document.querySelectorAll('.wall-item').forEach((el, i) => {
      el.classList.toggle('hidden', i >= limit);
    });
    toggleBtn.textContent = '展开 / Expand';
    
    // 收起时平滑滚动回图墙顶部，避免页面突然变短导致位置错乱
    const wallTop = document.querySelector('.wall').offsetTop - 40;
    window.scrollTo({ top: wallTop, behavior: 'smooth' });
  }
});

/* ===== 大图预览 ===== */
let currentImages = [];
let currentIndex = 0;

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxMeta = document.getElementById('lightboxMeta');
const captionBox = document.getElementById('captionBox');

function openLightbox(imgList, index) {
  currentImages = imgList;
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const img = currentImages[currentIndex];
  lightboxImg.src = img.src;
  lightboxMeta.textContent = (currentIndex + 1) + ' / ' + currentImages.length;

  if (img.note) {
    captionBox.innerHTML = `
      <div class="label">Directive</div>
      <div class="note">${img.note}</div>
    `;
  } else {
    captionBox.innerHTML = '';
  }
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateLightbox();
}

function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateLightbox();
}

lightbox.addEventListener('click', (e) => {
  if (e.target.classList.contains('lightbox-img')) return;
  if (e.target.closest('.lightbox-arrow')) return;
  closeLightbox();
});

document.getElementById('prev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevImage();
});

document.getElementById('next').addEventListener('click', (e) => {
  e.stopPropagation();
  nextImage();
});

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'Escape') closeLightbox();
  }
});

let touchStartX = 0;
lightbox.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

lightbox.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx > 0) prevImage();
    else nextImage();
  }
}, { passive: true });
</script>

</body>
</html>
