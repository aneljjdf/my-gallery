<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0.07%</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: "EB Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .cube-wrap {
    padding: 20vh 10vw;
    max-width: 1200px;
    margin: 0 auto;
  }
  .title {
    font-family: "EB Garamond", "Noto Sans SC", Georgia, serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-align: center;
    line-height: 1.4;
  }
  .title .line { display: block; }
  .title .line1 { margin-bottom: 0.15em; }
  .subtitle {
    font-size: 12px;
    letter-spacing: 0.4em;
    text-align: center;
    text-transform: uppercase;
    color: #999;
    margin-top: 24px;
  }

  .data-block {
    margin-top: 20vh;
    margin-bottom: 20vh;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.3em;
    line-height: 3;
    color: #333;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding: 40px 0;
  }

  .specimen-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25vh;
  }
  .specimen {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }
  .specimen img {
    width: 100%;
    height: auto;
    display: block;
  }
  .specimen-info { margin-top: 24px; }
  .specimen-name {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .specimen-season {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #888;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .archive-entry {
    margin-top: 25vh;
    text-align: center;
  }
  .archive-entry a {
    text-decoration: none;
    color: #000;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    border-bottom: 1px solid #ccc;
    padding-bottom: 6px;
    transition: border-color 0.3s;
  }
  .archive-entry a:hover {
    border-color: #000;
  }

  @media (max-width: 600px) {
    .cube-wrap { padding: 14vh 6vw; }
    .title { font-size: 26px; letter-spacing: 0.08em; }
    .subtitle { letter-spacing: 0.3em; }
    .data-block {
      margin-top: 14vh;
      margin-bottom: 14vh;
      letter-spacing: 0.2em;
      line-height: 2.6;
    }
    .specimen-list { gap: 16vh; }
    .archive-entry { margin-top: 16vh; }
  }
</style>
</head>
<body>
  <div class="cube-wrap">

    <div class="title">
      <span class="line line1">为这个领域，</span>
      <span class="line line2">划一条金线。</span>
    </div>
    <div class="subtitle">显影室 / 0.07%</div>

    <div class="data-block">
      <div>阅过造型 600,000+</div>
      <div>金线之上 500</div>
      <div>成立率 0.07%</div>
    </div>

    <div class="specimen-list">
      <div class="specimen">
        <img src="images/loewe/01.webp" alt="">
        <div class="specimen-info">
          <div class="specimen-name">LOEWE</div>
          <div class="specimen-season">FALL 2024 READY-TO-WEAR</div>
        </div>
      </div>
      <div class="specimen">
        <img src="images/robert-wun/01.webp" alt="">
        <div class="specimen-info">
          <div class="specimen-name">ROBERT WUN</div>
          <div class="specimen-season">SPRING 2026 COUTURE</div>
        </div>
      </div>
      <div class="specimen">
        <img src="images/saint-laurent/01.webp" alt="">
        <div class="specimen-info">
          <div class="specimen-name">SAINT LAURENT</div>
          <div class="specimen-season">SPRING 2018 READY-TO-WEAR</div>
        </div>
      </div>
    </div>

    <div class="archive-entry">
      <a href="archive.html">进入完整档案 / Enter Archive</a>
    </div>

  </div>
</body>
</html>
