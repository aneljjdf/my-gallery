<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>为这个领域，划一条金线。</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111111'/%3E%3Cline x1='20' y1='50' x2='80' y2='50' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    background: #ffffff; 
    color: #111;
    font-family: "Inter", "Noto Sans SC", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶栏：极窄居中 ===== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 36px; 
    background: #111111; 
    display: flex;
    align-items: center;
    z-index: 100;
  }

  .header .center-text {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Helvetica", "Inter", sans-serif; 
    font-size: 11px; 
    font-weight: 500; 
    letter-spacing: 0.25em; 
    color: #eeeeee; 
    text-transform: uppercase;
  }

  /* ===== 第一屏：宣告 ===== */
  .opening {
    min-height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
  }

  .opening .line-main {
    font-family: "EB Garamond", "Noto Sans SC", Georgia, serif;
    font-size: 38px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: #111;
    line-height: 1.6;
  }

  /* 手机端主标题：绝对对称的两行 */
  @media (max-width: 600px) {
    .opening { min-height: 80vh; }
    .opening .line-main { font-size: 24px; letter-spacing: 0.08em; }
    .opening .line-main .line1 { display: block; margin-bottom: 12px; }
    .opening .line-main .line2 { display: block; }
  }

  /* ===== 第二屏：真理三段 ===== */
  .truth-section {
    max-width: 600px;
    margin: 0 auto;
    padding: 10vh 40px 15vh;
    text-align: left;
    border-top: 1px solid #f0f0f0;
  }

  .truth-block {
    margin-bottom: 12vh;
  }
  
  .truth-block:last-child {
    margin-bottom: 0;
  }

  .truth-block p {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.15em;
    line-height: 2.2;
    color: #111;
  }

  @media (max-width: 600px) {
    .truth-section { padding: 10vh 24px 15vh; }
    .truth-block { margin-bottom: 10vh; }
    .truth-block p { font-size: 14px; letter-spacing: 0.1em; line-height: 2; }
  }

  /* ===== 第三屏：图墙入口 ===== */
  .archive-entry {
    text-align: center;
    padding-bottom: 20vh;
  }

  .archive-entry a {
    text-decoration: none;
    color: #111;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    border-bottom: 1px solid #ccc;
    padding-bottom: 8px;
    transition: border-color 0.3s;
  }

  .archive-entry a:hover {
    border-color: #111;
  }
</style>
</head>
<body>

  <!-- 顶栏：不再叫显影室，只有 0.07% -->
  <div class="header" id="mainHeader">
    <div class="center-text">0.07%</div>
  </div>

  <!-- 第一屏：宣告 -->
  <div class="opening">
    <div class="line-main">
      <!-- 电脑端一行，手机端绝对对称两行 -->
      <span class="line1">为这个领域，</span>
      <span class="line2">划一条金线。</span>
    </div>
  </div>

  <!-- 第二屏：三段核心事实 -->
  <div class="truth-section">
    <div class="truth-block">
      <p>标准不散落于众口。<br>金线不看谁声高，不看多少人附和。</p>
    </div>

    <div class="truth-block">
      <p>不需要批准，无法修改。<br>它自身成立。</p>
    </div>

    <div class="truth-block">
      <p>金线不是被发明，而是被发现。<br>它本来就在。<br><br>此刻，它第一次在场。</p>
    </div>
  </div>

  <!-- 第三屏：入口 -->
  <div class="archive-entry">
    <a href="archive.html">进入完整档案 / Enter Archive</a>
  </div>

</body>
</html>
